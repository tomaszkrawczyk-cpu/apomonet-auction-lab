<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Domy aukcyjne • ApoMonet</title><link rel="stylesheet" href="style.css"><style>.searchbar{display:grid;grid-template-columns:1fr auto;gap:10px;width:100%}.searchbar .btn{min-width:110px}.search-meta{margin:10px 0 16px;color:#8f8f95;font-size:13px}.house.hidden{display:none}.house.manage{grid-template-columns:auto 1fr auto}.house-select{width:20px;height:20px}.danger{background:#2b1111!important;border-color:#5a2323!important}.featured{border-color:#76551f!important;background:linear-gradient(135deg,#1b160e,#121214)!important}.tester-badge{display:inline-block;margin-bottom:8px;padding:5px 9px;border:1px solid #76551f;border-radius:999px;color:#e0b96b;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}@media(max-width:560px){.searchbar{grid-template-columns:1fr}.searchbar .btn{width:100%}.house.manage{grid-template-columns:auto 1fr}.house.manage>a,.house.manage>span{grid-column:2}}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="index.html">Start</a><a href="analyze.html">Analiza</a><a href="collection.html">Kolekcja</a><a href="calendar.html">Kalendarz</a><a class="active" href="auction-houses.html">Domy aukcyjne</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">Rynek</span><h1>Domy aukcyjne</h1><p>Katalog domów aukcyjnych z wyszukiwaniem, profilem, aukcjami i archiwum.</p></section><div class="toolbar"><div class="searchbar"><input id="houseSearch" class="input" placeholder="Np. Stary Sklep, WCN, Niemczyk, GNDM…" autocomplete="off"><button id="searchButton" class="btn primary" type="button">Szukaj</button></div><select id="region" class="input"><option value="all">Wszystkie regiony</option><option value="polska">Polska</option><option value="europa">Europa</option><option value="swiat">Świat</option></select><button id="manageHouses" class="btn secondary">Zaznacz / usuń</button><button id="deleteHouses" class="btn secondary danger hidden">Usuń zaznaczone</button></div><div id="searchMeta" class="search-meta"></div><section id="houseList" class="house-list"></section><div id="noResults" class="empty hidden">Brak wyników.</div></main><script>const houses=[{id:'stary-sklep',name:'Stary Sklep — Sylwester Kopyciński',full:'Stary Sklep Sylwester Kopyciński',region:'polska',desc:'Pierwszy tester APOMONET — wyróżniony profil partnera testowego.',href:'auction-house.html?id=stary-sklep',featured:true},{id:'wcn',name:'WCN',full:'WCN Warszawskie Centrum Numizmatyczne',region:'polska',desc:'Warszawskie Centrum Numizmatyczne — profil roboczy.',href:'auction-house.html?id=wcn'},{id:'niemczyk',name:'Niemczyk',full:'Niemczyk Antykwariat Numizmatyczny Michał Niemczyk',region:'polska',desc:'Profil roboczy domu aukcyjnego.',href:'auction-house.html?id=niemczyk'},{id:'gndm',name:'GNDM',full:'GNDM Gabinet Numizmatyczny Damian Marciniak',region:'polska',desc:'Profil roboczy domu aukcyjnego.',href:'auction-house.html?id=gndm'},{id:'europa-demo',name:'Dom aukcyjny — Europa',full:'Dom aukcyjny Europa',region:'europa',desc:'DO UZUPEŁNIENIA',href:'#'}];let manage=false;const KEY='apomonet_deleted_houses';const deleted=()=>JSON.parse(localStorage.getItem(KEY)||'[]');function render(){const q=(houseSearch.value||'').trim().toLowerCase(),r=region.value,del=deleted();const list=houses.filter(h=>!del.includes(h.id)&&(!q||h.full.toLowerCase().includes(q))&&(r==='all'||h.region===r));houseList.innerHTML=list.map(h=>`<article class="house${manage?' manage':''}${h.featured?' featured':''}">${manage?`<input class="house-select" type="checkbox" value="${h.id}">`:''}<div>${h.featured?'<span class="tester-badge">★ Pierwszy tester APOMONET</span>':''}<h3>${h.name}</h3><p>${h.desc}</p></div><a class="btn secondary" href="${h.href}">Otwórz</a></article>`).join('');noResults.classList.toggle('hidden',list.length>0);searchMeta.textContent=`Widoczne domy aukcyjne: ${list.length}.`;deleteHouses.classList.toggle('hidden',!manage)}searchButton.onclick=render;houseSearch.oninput=render;houseSearch.onkeydown=e=>{if(e.key==='Enter')render()};region.onchange=render;manageHouses.onclick=()=>{manage=!manage;render()};deleteHouses.onclick=()=>{const ids=[...document.querySelectorAll('.house-select:checked')].map(x=>x.value);if(!ids.length)return alert('Najpierw zaznacz domy aukcyjne.');if(!confirm(`Usunąć ${ids.length} zaznaczon${ids.length===1?'y wpis':'e wpisy'} z Twojej listy?`))return;localStorage.setItem(KEY,JSON.stringify([...new Set([...deleted(),...ids])]));render()};render();</script></body></html>
