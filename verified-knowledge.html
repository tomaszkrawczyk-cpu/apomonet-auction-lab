<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zweryfikowana wiedza • ApoMonet</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="knowledge-add.html">Dodaj obserwację</a><a href="knowledge-consensus.html">Konsensus</a><a class="active" href="verified-knowledge.html">Zweryfikowana wiedza</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">APOMONET KNOWLEDGE</span><h1>Zweryfikowana wiedza</h1><p>Trafiają tu tylko obserwacje potwierdzone przez co najmniej dwa niezależne źródła albo eksperta.</p></section><section class="card"><input id="q" class="input" placeholder="Szukaj"><div id="list"></div></section></main><script src="app.js"></script><script src="verified-knowledge-core.js"></script><script>function draw(){const rows=ApoVerifiedKnowledge.search(q.value||'');list.innerHTML=rows.length?rows.map(x=>'<div class="event"><div><strong>'+[x.ruler,x.year,x.nominal,x.mint,x.variant].filter(Boolean).join(' • ')+'</strong><p class="muted">Źródła: '+(x.sources||[]).join(', ')+' • katalog: '+(x.catalogRef||'—')+'</p></div><span class="badge">ZWERYFIKOWANE</span></div>').join(''):'<div class="empty">Brak zweryfikowanej wiedzy.</div>'}q.oninput=draw;draw();</script></body></html>
