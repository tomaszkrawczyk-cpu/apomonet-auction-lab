<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Album użytkownika • ApoMonet</title><link rel="stylesheet" href="style.css"><style>.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}.coin-card{position:relative}.pick{position:absolute;right:12px;top:12px}.pick input{width:20px;height:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.selectbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 18px}.selected-info{color:#aaa;font-size:13px}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:430px){.filters{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="albums.html">← Albumy</a><a href="collection.html">Kolekcja</a><a href="analyze.html">Analiza</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">Album użytkownika</span><h1 id="title">Album</h1><p id="desc"></p></section><div class="filters"><select id="rulerFilter" class="input"><option value="">Wszyscy władcy / emitenci</option></select><select id="nominalFilter" class="input"><option value="">Wszystkie nominały</option></select><select id="mintFilter" class="input"><option value="">Wszystkie mennice</option></select><select id="metalFilter" class="input"><option value="">Wszystkie metale</option></select></div><div class="selectbar"><button id="selectAll" class="btn secondary">Zaznacz wszystko</button><button id="clearSelection" class="btn secondary">Odznacz wszystko</button><button id="pdfSelected" class="btn primary">PDF z wybranych</button><button id="xlsxSelected" class="btn primary">Excel z wybranych</button><button id="shareSelected" class="btn secondary">Udostępnij wybrane</button><span id="selectedInfo" class="selected-info">Zaznaczono: 0</span></div><section id="list" class="grid"></section></main><script src="app.js"></script><script>const albumId=new URLSearchParams(location.search).get('id'),selected=new Set(),filters=[['rulerFilter','ruler'],['nominalFilter','nominal'],['mintFilter','mint'],['metalFilter','metal']];function state(){return ApoMonet.load()}function album(){return (state().albums||[]).find(a=>a.id===albumId)}function albumCoins(){return (state().coins||[]).filter(c=>(c.albumIds||[]).includes(albumId))}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function rebuildFilters(){const cs=albumCoins();for(const [id,key] of filters){const e=document.getElementById(id),keep=e.value,first=e.options[0].textContent;e.innerHTML='<option value="">'+first+'</option>';[...new Set(cs.map(c=>c[key]).filter(Boolean))].sort().forEach(v=>e.insertAdjacentHTML('beforeend','<option>'+esc(v)+'</option>'));if([...e.options].some(o=>o.value===keep))e.value=keep}}function filtered(){return albumCoins().filter(c=>filters.every(([id,key])=>!document.getElementById(id).value||c[key]===document.getElementById(id).value))}function updateSelected(){selectedInfo.textContent='Zaznaczono: '+selected.size}function render(){const a=album();if(!a){title.textContent='Album nie istnieje';desc.textContent='Wróć do listy albumów.';list.innerHTML='<div class="empty">Nie znaleziono albumu.</div>';return}title.textContent=a.name;desc.textContent=a.description||'Własny album użytkownika.';const allAlbums=state().albums||[],cs=filtered();list.innerHTML=cs.length?cs.map(c=>`<article class="card coin-card"><label class="pick"><input class="coin-pick" type="checkbox" data-id="${c.id}" ${selected.has(c.id)?'checked':''}></label><span class="eyebrow">${esc(c.year||'Rok nieustalony')}</span><h2>${esc(c.title||'Moneta bez nazwy')}</h2><p>${[c.ruler,c.nominal,c.mint,c.metal].filter(Boolean).map(esc).join(' • ')}</p><div class="actions"><a class="btn secondary" href="coin-edit.html?id=${encodeURIComponent(c.id)}">Edytuj</a><button class="btn secondary remove" data-id="${c.id}">Usuń z albumu</button><select class="input move" data-id="${c.id}" style="max-width:220px"><option value="">Przenieś do innego albumu…</option>${allAlbums.filter(x=>x.id!==albumId).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div></article>`).join(''):'<div class="empty">Ten album jest pusty albo filtry ukrywają wszystkie monety.</div>';document.querySelectorAll('.coin-pick').forEach(x=>x.onchange=()=>{x.checked?selected.add(x.dataset.id):selected.delete(x.dataset.id);updateSelected()});document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{const c=state().coins.find(x=>x.id===b.dataset.id);if(!c||!confirm('Usunąć „'+(c.title||'tę monetę')+'” tylko z tego albumu? Moneta pozostanie w kolekcji.'))return;ApoMonet.removeCoinFromAlbum(c.id,albumId);selected.delete(c.id);rebuildFilters();render();updateSelected()});document.querySelectorAll('.move').forEach(s=>s.onchange=()=>{if(!s.value)return;ApoMonet.moveCoinBetweenAlbums(s.dataset.id,albumId,s.value);selected.delete(s.dataset.id);rebuildFilters();render();updateSelected()})}function exportSelected(type){if(!selected.size)return alert('Najpierw zaznacz monety.');sessionStorage.setItem('apomonet_export_ids',JSON.stringify([...selected]));sessionStorage.removeItem('apomonet_demo_export_coins');location.href='export.html?type='+type}async function share(){const cs=state().coins.filter(c=>selected.has(c.id));if(!cs.length)return alert('Najpierw zaznacz monety.');const text='APOMONET — '+(album()?.name||'album')+'\n\n'+cs.map((c,i)=>`${i+1}. ${c.title||'Moneta'}${c.year?' — '+c.year:''}${c.ruler?' — '+c.ruler:''}`).join('\n');if(navigator.share){try{await navigator.share({title:'APOMONET — '+(album()?.name||'album'),text});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(text);alert('Lista została skopiowana.')}catch{}}filters.forEach(([id])=>document.getElementById(id).onchange=render);selectAll.onclick=()=>{filtered().forEach(c=>selected.add(c.id));render();updateSelected()};clearSelection.onclick=()=>{selected.clear();render();updateSelected()};pdfSelected.onclick=()=>exportSelected('pdf');xlsxSelected.onclick=()=>exportSelected('excel');shareSelected.onclick=share;rebuildFilters();render();updateSelected();</script></body></html>
