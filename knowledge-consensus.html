<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konsensus wiedzy • ApoMonet</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="knowledge-add.html">Dodaj obserwację</a><a class="active" href="knowledge-consensus.html">Konsensus</a><a href="verified-knowledge.html">Zweryfikowana wiedza</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">APOMONET LAB</span><h1>Konsensus odmian</h1><p>Pojedynczy rekord pozostaje obserwacją. Silniejsza wiedza wymaga co najmniej dwóch niezależnych źródeł albo potwierdzenia eksperta.</p></section><section class="card"><div class="toolbar"><input id="q" class="input" placeholder="Szukaj w wiedzy APOMONET"><button id="seedBtn" class="btn secondary" type="button">Wczytaj próbkę badawczą</button></div><div id="status" class="status"></div><div id="list"></div></section></main><script src="knowledge-builder-core.js"></script><script src="knowledge-seed.js"></script><script src="verified-knowledge-core.js"></script><script>function draw(){const z=(q.value||'').toLowerCase(),groups=ApoKnowledge.consensus().filter(g=>!z||g.key.includes(z));list.innerHTML=groups.length?groups.map((g,i)=>'<div class="event"><div><strong>'+g.rows.map(r=>[r.ruler,r.year,r.nominal,r.mint,r.variant].filter(Boolean).join(' • '))[0]+'</strong><p class="muted">Źródła: '+g.sources.join(', ')+' • obserwacji: '+g.count+'</p></div><div><span class="badge">'+(g.strength==='strong'?'POTWIERDZONE':'JEDNO ŹRÓDŁO')+'</span>'+(g.strength==='strong'?'<button class="btn secondary promote" data-i="'+i+'" type="button">Promuj do wiedzy</button>':'')+'</div></div>').join(''):'<div class="empty">Brak zapisanej wiedzy.</div>';list.querySelectorAll('.promote').forEach(b=>b.onclick=()=>{try{ApoVerifiedKnowledge.promote(groups[Number(b.dataset.i)]);status.textContent='Potwierdzona obserwacja trafiła do zweryfikowanej wiedzy APOMONET.'}catch(e){status.textContent=e.message}})}q.oninput=draw;seedBtn.onclick=()=>{let n=0;for(const r of ApoKnowledgeSeed||[]){try{ApoKnowledge.add(r);n++}catch{}}status.textContent='Dodano '+n+' ręcznie opracowane obserwacje faktograficzne.';draw()};draw();</script></body></html>
