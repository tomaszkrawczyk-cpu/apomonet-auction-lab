<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analiza monety — ApoMonet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a class="active" href="analyze.html">Analiza</a><a href="collection.html">Kolekcja</a><a href="albums.html">Albumy</a><a href="calendar.html">Kalendarz</a><a href="auction-houses.html">Domy aukcyjne</a></nav></header>
  <main class="shell narrow">
    <section class="hero compact"><span class="eyebrow">AI Coin Lab</span><h1>Analiza monety</h1><p>Wybierz awers i rewers jednocześnie. Pierwsze zdjęcie = awers, drugie = rewers.</p></section>
    <label class="picker" for="coinImagesInput">
      <div class="picker-title">Dotknij całego pola i wybierz 2 zdjęcia naraz</div>
      <div class="coin-grid">
        <div class="coin-card"><h2>Awers</h2><div class="preview-box"><span id="obversePlaceholder" class="placeholder">Pierwsze zdjęcie</span><img id="obversePreview" alt="Podgląd awersu" /></div></div>
        <div class="coin-card"><h2>Rewers</h2><div class="preview-box"><span id="reversePlaceholder" class="placeholder">Drugie zdjęcie</span><img id="reversePreview" alt="Podgląd rewersu" /></div></div>
      </div>
      <div class="hint">Możesz zamienić strony przed analizą.</div>
    </label>
    <input id="coinImagesInput" type="file" accept="image/*" multiple hidden />
    <button id="swapButton" class="btn secondary full hidden" type="button">Zamień awers ↔ rewers</button>
    <button id="analyzeButton" class="btn primary full" type="button">Analizuj monetę</button>
    <div id="status" class="status"></div>
    <pre id="result" class="result hidden"></pre>
  </main>
<script>
let obverseFile=null,reverseFile=null;
const input=document.getElementById('coinImagesInput'),obversePreview=document.getElementById('obversePreview'),reversePreview=document.getElementById('reversePreview'),obversePlaceholder=document.getElementById('obversePlaceholder'),reversePlaceholder=document.getElementById('reversePlaceholder'),swapButton=document.getElementById('swapButton'),analyzeButton=document.getElementById('analyzeButton'),status=document.getElementById('status'),result=document.getElementById('result');
function preview(file,img,placeholder){const r=new FileReader();r.onload=e=>{img.src=e.target.result;img.style.display='block';placeholder.style.display='none'};r.readAsDataURL(file)}
function refresh(){if(obverseFile)preview(obverseFile,obversePreview,obversePlaceholder);if(reverseFile)preview(reverseFile,reversePreview,reversePlaceholder);swapButton.classList.toggle('hidden',!(obverseFile&&reverseFile))}
input.addEventListener('change',()=>{const files=Array.from(input.files||[]);if(files.length<2){status.textContent='Wybierz dwa zdjęcia jednocześnie.';return}obverseFile=files[0];reverseFile=files[1];status.textContent='Dwa zdjęcia gotowe do analizy.';refresh()});
swapButton.addEventListener('click',()=>{[obverseFile,reverseFile]=[reverseFile,obverseFile];obversePreview.style.display='none';reversePreview.style.display='none';obversePlaceholder.style.display='block';reversePlaceholder.style.display='block';refresh()});
function compressImage(file,maxSize=1100,quality=.68){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=e=>{const img=new Image();img.onerror=reject;img.onload=()=>{let w=img.width,h=img.height;if(w>maxSize||h>maxSize){const ratio=Math.min(maxSize/w,maxSize/h);w=Math.round(w*ratio);h=Math.round(h*ratio)}const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.src=e.target.result};reader.readAsDataURL(file)})}
function format(a){const lines=[`Moneta: ${a.title||'Nie ustalono'}`,`Nominał: ${a.nominal||'Nie ustalono'}`,`Władca / emitent: ${a.ruler||'Nie ustalono'}`,`Rok: ${a.year||'Nie ustalono'}`,`Odczyt daty: ${a.visibleDateReading||'Nie ustalono'}`,`Mennica: ${a.mint||'Nie ustalono'}`,`Odmiana: ${a.variant||'Nie ustalono'}`,`Stan: ${a.grade||'Nie ustalono'}`,`Rzadkość: ${a.rarity||'Nie ustalono'}`,`Wycena: ${a.estimatedPrice||'Nie ustalono'}`,`Zakres aukcyjny: ${a.priceRange||'Nie ustalono'}`,`Pewność: ${Number.isFinite(a.confidence)?a.confidence+'%':'Nie ustalono'}`,`Legenda awersu: ${a.obverseLegend||'Nie ustalono'}`,`Legenda rewersu: ${a.reverseLegend||'Nie ustalono'}`];if(a.evidenceSummary?.length)lines.push('\nDowody:',...a.evidenceSummary.map(x=>'• '+x));if(a.alternatives?.length)lines.push('\nAlternatywy:',...a.alternatives.map(x=>'• '+x));if(a.rejectedCandidates?.length)lines.push('\nOdrzucone kandydatury:',...a.rejectedCandidates.map(x=>'• '+x));if(a.warnings?.length)lines.push('\nUwagi:',...a.warnings.map(x=>'• '+x));return lines.join('\n')}
analyzeButton.addEventListener('click',async()=>{if(!obverseFile||!reverseFile){alert('Wybierz dwa zdjęcia monety naraz.');return}try{analyzeButton.disabled=true;result.classList.add('hidden');status.textContent='Przygotowuję zdjęcia...';const [obverse,reverse]=await Promise.all([compressImage(obverseFile),compressImage(reverseFile)]);status.textContent='Analizuję monetę...';const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images:[obverse,reverse]})});const text=await response.text();let data;try{data=JSON.parse(text)}catch{data=null}if(!response.ok)throw new Error(data?.error||text||'Błąd analizy.');status.textContent='Analiza zakończona.';result.classList.remove('hidden');result.textContent=data?.analysis?format(data.analysis):text}catch(e){status.textContent='Wystąpił błąd.';result.classList.remove('hidden');result.textContent=e?.message||'Nie udało się połączyć z serwerem.'}finally{analyzeButton.disabled=false}});
</script>
</body></html>
