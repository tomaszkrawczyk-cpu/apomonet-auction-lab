<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analiza monety — ApoMonet</title><link rel="stylesheet" href="style.css"><style>.analysis-panel{margin-top:20px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fact,.detail{background:#121214;border:1px solid #29292c;border-radius:15px;padding:14px}.fact span{display:block;color:#8f8f95;font-size:12px;margin-bottom:5px}.fact strong{font-size:16px}.fact.highlight{border-color:#5e441c;background:#16120c}.actions-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.action-card{border:1px solid #303034;background:#151517;color:#fff;border-radius:16px;padding:16px;text-align:left;cursor:pointer}.action-card strong{display:block;font-size:16px;margin-bottom:5px}.action-card span{color:#999;font-size:13px}.action-card.primary{border-color:#6b4814;background:#241806}.detail{margin-top:12px;line-height:1.6}.hidden{display:none!important}@media(max-width:560px){.facts,.actions-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a class="active" href="analyze.html">Analiza</a><a href="collection.html">Kolekcja</a><a href="albums.html">Albumy</a><a href="calendar.html">Kalendarz</a><a href="auction-houses.html">Domy aukcyjne</a></nav></header><main class="shell narrow"><section class="hero compact"><span class="eyebrow">AI Coin Lab</span><h1>Analiza monety</h1><p>Etap 1: szybka identyfikacja. Dopiero Ty decydujesz, czy uruchomić analizę szczegółową odmiany.</p></section><label class="picker" for="coinImagesInput"><div class="picker-title">Wybierz awers i rewers jednocześnie</div><div class="coin-grid"><div class="coin-card"><h2>Awers</h2><div class="preview-box"><span id="op" class="placeholder">Pierwsze zdjęcie</span><img id="oi"></div></div><div class="coin-card"><h2>Rewers</h2><div class="preview-box"><span id="rp" class="placeholder">Drugie zdjęcie</span><img id="ri"></div></div></div></label><input id="coinImagesInput" type="file" accept="image/*" multiple hidden><button id="swap" class="btn secondary full hidden">Zamień awers ↔ rewers</button><button id="go" class="btn primary full">Szybka analiza</button><div id="status" class="status"></div><section id="panel" class="analysis-panel hidden"><div class="section-title"><h2>Etap 1 — identyfikacja podstawowa</h2><span id="conf" class="todo"></span></div><div id="facts" class="facts"></div><div class="detail"><b>Opis podstawowy</b><p id="desc"></p></div><div class="section-title"><h2>Co dalej?</h2></div><div class="actions-grid"><button id="deep" class="action-card primary"><strong>🔬 Analiza szczegółowa</strong><span>Interpunkcja, pióra, skrzydła, znaki, odmiana i katalog.</span></button><button id="edit" class="action-card"><strong>✏️ Najpierw popraw dane</strong><span>Skoryguj rok lub władcę przed analizą szczegółową.</span></button><button id="save" class="action-card"><strong>💾 Zapisz bez szczegółów</strong><span>Podstawowa identyfikacja mi wystarcza.</span></button><button id="album" class="action-card"><strong>📚 Zapisz i wybierz album</strong><span>Dodaj monetę do kolekcji i przejdź do albumów.</span></button></div><section id="deepPanel" class="hidden"><div class="section-title"><h2>Etap 2 — analiza szczegółowa</h2><span id="deepConf" class="todo"></span></div><div id="deepText" class="detail"></div></section></section></main><script src="app.js"></script><script>
let a=null,of=null,rf=null,imgs=null,id=null;const $=x=>document.getElementById(x),input=$('coinImagesInput');function pv(f,i,p){let r=new FileReader;r.onload=e=>{$(i).src=e.target.result;$(i).style.display='block';$(p).style.display='none'};r.readAsDataURL(f)}input.onchange=()=>{let f=[...(input.files||[])];if(f.length<2){$('status').textContent='Wybierz dwa zdjęcia.';return}of=f[0];rf=f[1];pv(of,'oi','op');pv(rf,'ri','rp');$('swap').classList.remove('hidden');$('status').textContent='Gotowe do szybkiej analizy.'};$('swap').onclick=()=>{[of,rf]=[rf,of];pv(of,'oi','op');pv(rf,'ri','rp')};function cmp(f,m=900,q=.58){return new Promise((ok,no)=>{let r=new FileReader;r.onerror=no;r.onload=e=>{let im=new Image;im.onload=()=>{let w=im.width,h=im.height,z=Math.min(1,m/w,m/h);let c=document.createElement('canvas');c.width=w*z;c.height=h*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.src=e.target.result};r.readAsDataURL(f)})}const v=x=>x&&String(x).trim()?x:'Nie ustalono';function render(){let rows=[['Kraj / emitent',a.country],['Władca',a.ruler],['Rok',a.year],['Nominał',a.nominal],['Metal',a.metal],['Mennica',a.mint],['Typ',a.variant],['Stan',a.grade]];$('facts').innerHTML=rows.map((x,i)=>`<div class="fact${i==1||i==2?' highlight':''}"><span>${x[0]}</span><strong>${v(x[1])}</strong></div>`).join('');$('conf').textContent=`Pewność ${a.confidence||0}%`;$('desc').textContent=v(a.fullDescription);$('panel').classList.remove('hidden');$('panel').scrollIntoView({behavior:'smooth'})}function save(){let c=ApoMonet.upsertCoin({id:id||undefined,...a,description:a.fullDescription,analysisLevel:a.detail?'detailed':'basic'});id=c.id;return c}$('go').onclick=async()=>{if(!of||!rf)return alert('Wybierz dwa zdjęcia.');try{$('go').disabled=true;$('status').textContent='Szybka analiza podstawowych danych…';imgs=await Promise.all([cmp(of),cmp(rf)]);let r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images:imgs,mode:'basic'})}),d=await r.json();if(!r.ok)throw Error(d.error);a=d.analysis;render();$('status').textContent='Etap 1 gotowy.'}catch(e){$('status').textContent='Błąd: '+e.message}finally{$('go').disabled=false}};$('deep').onclick=async()=>{try{$('deep').disabled=true;$('status').textContent='Analiza szczegółowa — badam cechy odmiany…';let r=await fetch('/api/analyze-detail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images:imgs,base:a})}),d=await r.json();if(!r.ok)throw Error(d.error);a={...a,...d.detail,detail:d.detail};$('deepConf').textContent=`Pewność ${d.detail.confidence||0}%`;$('deepText').innerHTML=`<b>Odmiana:</b> ${v(d.detail.variant)}<br><b>Kopicki:</b> ${v(d.detail.kopickiReference)} • ${v(d.detail.kopickiRarity)}<br><b>Interpunkcja:</b> ${v(d.detail.legendPunctuation)}<br><br>${v(d.detail.fullDescription)}`;$('deepPanel').classList.remove('hidden');$('status').textContent='Analiza szczegółowa zakończona.'}catch(e){$('status').textContent='Błąd: '+e.message}finally{$('deep').disabled=false}};$('save').onclick=()=>{save();$('status').textContent='Moneta zapisana w kolekcji.'};$('edit').onclick=()=>{let c=save();location.href='coin-edit.html?id='+encodeURIComponent(c.id)};$('album').onclick=()=>{save();location.href='albums.html'};
</script></body></html>
