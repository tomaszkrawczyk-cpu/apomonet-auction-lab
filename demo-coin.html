<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moneta demo • ApoMonet</title><link rel="stylesheet" href="style.css"><style>.demo-photo{display:flex;justify-content:center;padding:16px}.demo-photo img{max-width:100%;max-height:420px;object-fit:contain}.demo-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.demo-fact{padding:14px;border:1px solid #29292c;border-radius:14px;background:#121214}.demo-fact span{display:block;color:#8f8f95;font-size:12px;margin-bottom:5px}@media(max-width:560px){.demo-facts{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="albums.html">← Albumy</a><a href="calendar.html">Aukcje</a></nav></header><main class="shell narrow"><section class="hero compact"><span class="eyebrow">Karta monety</span><h1 id="title">Moneta</h1><p>Przykładowa karta monety z albumu demonstracyjnego.</p></section><section class="card demo-photo"><img id="photo" alt="Moneta"></section><section id="facts" class="demo-facts"></section><div class="toolbar"><a id="auctionLink" class="btn primary" href="calendar.html">Sprawdź aukcje</a><button class="btn secondary" type="button" onclick="history.back()">Wróć</button></div></main><script src="app.js"></script><script>
const IMG={mieszko:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Denar%20rys%20mieszko1.png?width=520',chrobry:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Denar%20Boleslav%20Chrobry.jpg?width=520',polonia:'https://commons.wikimedia.org/wiki/Special:Redirect/file/10%20zlotych%201932%20Polonia.jpg?width=620',sobieski:'https://commons.wikimedia.org/wiki/Special:Redirect/file/1933%2010-z%C5%82otych%20coin%20obverse%20with%20John%20III%20Sobieski.jpg?width=520',gulden:'https://commons.wikimedia.org/wiki/Special:Redirect/file/1%20Danziger%20Gulden%20%281923%29.jpg?width=620',fenigi:'https://commons.wikimedia.org/wiki/Special:Redirect/file/2fenigi%20gdansk.jpg?width=620',poloniaProba:'https://commons.wikimedia.org/wiki/Special:Redirect/file/PR%C3%93BA%2010%20z%C5%82otych%201932%20Polonia%20g%C5%82%C4%99bokie%20bicie.jpg?width=620'};
const C={
'mine-mieszko':['Denar Mieszka','ok. X–XI w.','Denar','Mieszko I / wczesni Piastowie','Polska','Pierwsi Piastowie','Srebro',IMG.mieszko],
'mine-chrobry':['Denar PRINCES POLONIE','ok. 1000','Denar','Bolesław I Chrobry','Polska','Pierwsi Piastowie','Srebro',IMG.chrobry],
'mine-polonia':['10 złotych Polonia','1932','10 złotych','II Rzeczpospolita','Warszawa','II Rzeczpospolita','Srebro',IMG.polonia],
'mine-sobieski':['10 złotych Jan III Sobieski','1933','10 złotych','II Rzeczpospolita','Warszawa','II Rzeczpospolita','Srebro',IMG.sobieski],
'target-gulden':['1 gulden','1923','1 gulden','Wolne Miasto Gdańsk','Utrecht','Wolne Miasto Gdańsk','Srebro',IMG.gulden],
'target-fenigi':['2 fenigi','1923','2 fenigi','Wolne Miasto Gdańsk','Berlin','Wolne Miasto Gdańsk','Brąz',IMG.fenigi],
'target-polonia':['10 złotych Polonia','1932','10 złotych','II Rzeczpospolita','Warszawa','II Rzeczpospolita','Srebro',IMG.polonia],
'target-chrobry':['Denar Bolesława Chrobrego','ok. 1000','Denar','Bolesław I Chrobry','Polska','Pierwsi Piastowie','Srebro',IMG.chrobry],
'dream-mieszko':['Denar wczesnopiastowski','ok. X–XI w.','Denar','Mieszko I / wczesni Piastowie','Polska','Pierwsi Piastowie','Srebro',IMG.mieszko],
'dream-chrobry':['Denar PRINCES POLONIE','ok. 1000','Denar','Bolesław I Chrobry','Polska','Pierwsi Piastowie','Srebro',IMG.chrobry],
'dream-proba':['PRÓBA 10 złotych Polonia','1932','10 złotych PRÓBA','II Rzeczpospolita','Warszawa','II Rzeczpospolita','Srebro',IMG.poloniaProba],
'dream-gulden':['1 gulden Wolnego Miasta Gdańska','1923','1 gulden','Wolne Miasto Gdańsk','Utrecht','Wolne Miasto Gdańsk','Srebro',IMG.gulden]};
const id=new URLSearchParams(location.search).get('id'),c=C[id];if(!c){document.getElementById('title').textContent='Nie znaleziono monety';document.getElementById('photo').hidden=true}else{document.getElementById('title').textContent=c[0];document.getElementById('photo').src=c[7];document.getElementById('auctionLink').href='calendar.html?coin='+encodeURIComponent(c[0])+'&coinId='+encodeURIComponent(id);const rows=[['Rok',c[1]],['Nominał',c[2]],['Władca / emitent',c[3]],['Mennica / kraj',c[4]],['Epoka',c[5]],['Metal',c[6]]];document.getElementById('facts').innerHTML=rows.map(r=>`<div class="demo-fact"><span>${r[0]}</span><strong>${r[1]}</strong></div>`).join('')}
</script></body></html>
