<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dodaj wiedzę • ApoMonet</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="tools.html">Narzędzia</a><a class="active" href="knowledge-add.html">Knowledge Builder</a></nav></header><main class="shell narrow"><section class="hero compact"><span class="eyebrow">APOMONET LAB</span><h1>Nowa obserwacja numizmatyczna</h1><p>Tylko fakty i źródło. Bez zdjęcia i bez kopiowania opisu.</p></section><section class="card"><select id="source" class="input"><option>WCN</option><option>NIEMCZYK</option><option>ONEBID</option><option>NUMISBIDS</option><option>COINSTRAIL</option><option>OTHER</option></select><div id="sourceMode" class="status"></div><input id="sourceUrl" class="input" placeholder="Link / identyfikator źródła"><input id="ruler" class="input" placeholder="Władca / emitent"><input id="year" class="input" placeholder="Rok"><input id="nominal" class="input" placeholder="Nominał"><input id="mint" class="input" placeholder="Mennica"><input id="metal" class="input" placeholder="Metal"><input id="variant" class="input" placeholder="Odmiana / typ"><input id="distinguishingFeatures" class="input" placeholder="Cecha odróżniająca"><input id="catalogRef" class="input" placeholder="Numer katalogowy"><label><input id="expertVerified" type="checkbox"> Potwierdzone przez eksperta</label><button id="saveBtn" class="btn primary full" type="button">Zapisz fakty</button><div id="status" class="status"></div><p><a href="knowledge-consensus.html">Zobacz konsensus wiedzy →</a></p></section></main><script src="knowledge-builder-core.js"></script><script>function mode(){const m=ApoKnowledge.sources[source.value]?.mode||'MANUAL_REVIEW';sourceMode.textContent='Tryb źródła: '+m+' • automatyczne pobieranie wyłączone.'}source.onchange=mode;saveBtn.onclick=()=>{try{ApoKnowledge.add({source:source.value,sourceUrl:sourceUrl.value,ruler:ruler.value,year:year.value,nominal:nominal.value,mint:mint.value,metal:metal.value,variant:variant.value,distinguishingFeatures:distinguishingFeatures.value,catalogRef:catalogRef.value,expertVerified:expertVerified.checked});status.textContent='Zapisano znormalizowane fakty i provenance.'}catch(e){status.textContent=e.message}};mode();</script></body></html>
