<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katalog • ApoMonet</title><link rel="stylesheet" href="style.css"><style>.catalog-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.line{padding:10px 0;border-bottom:1px solid #29292c}.check{margin-top:12px;padding:14px;border:1px solid #4a361b;border-radius:14px;background:#17120c}@media(max-width:650px){.catalog-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="analyze.html">Analiza</a><a class="active" href="catalog.html">Katalog</a><a href="archive.html">Archiwum</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">Baza wiedzy</span><h1>Katalog APOMONET</h1><p>Podstawowy słownik historyczny i walidator. To fundament rozwijanej bazy, a nie zamiennik katalogu specjalistycznego.</p></section><section class="card"><h2>Kontrola danych</h2><div class="toolbar"><input id="year" class="input" placeholder="Rok, np. 1588"><input id="ruler" class="input" placeholder="Władca, np. Zygmunt III Waza"><input id="nominal" class="input" placeholder="Nominał, np. dukat"><button id="checkBtn" class="btn primary">Sprawdź</button></div><div id="checkResult" class="check">Wpisz dane do kontroli.</div></section><section class="catalog-grid" style="margin-top:16px"><div class="card"><h2>Władcy</h2><input id="rq" class="input" placeholder="Szukaj władcy"><div id="rulers"></div></div><div class="card"><h2>Nominały i mennice</h2><input id="dq" class="input" placeholder="Szukaj"><div id="dict"></div></div></section></main><script src="app.js"></script><script>const $=x=>document.getElementById(x),N=ApoNumis;function drawR(){const q=rq.value.toLowerCase();rulers.innerHTML=N.rulers.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<div class="line"><strong>${x.name}</strong><br><span class="muted">${x.from}–${x.to} • ${N.eras.find(e=>e.id===x.era)?.name||''}</span></div>`).join('')}function drawD(){const q=dq.value.toLowerCase(),ds=N.denominations.filter(x=>x.toLowerCase().includes(q)),ms=N.mints.filter(x=>x.toLowerCase().includes(q));dict.innerHTML='<strong>Nominały</strong>'+ds.map(x=>`<div class="line">${x}</div>`).join('')+'<br><strong>Mennice</strong>'+ms.map(x=>`<div class="line">${x}</div>`).join('')}checkBtn.onclick=()=>{const a={year:year.value,ruler:ruler.value,nominal:nominal.value},v=N.validate(a),p=v.possibleRulers.map(x=>x.name).join(', ');checkResult.innerHTML=`<strong>Epoka:</strong> ${v.era?.name||'Nie ustalono'}<br><strong>Władcy pasujący do roku:</strong> ${p||'Brak w słowniku'}<br><br>${v.warnings.length?v.warnings.map(x=>'⚠️ '+x).join('<br>'):'✓ Brak podstawowej sprzeczności w obecnym słowniku.'}`};rq.oninput=drawR;dq.oninput=drawD;drawR();drawD();</script></body></html>
