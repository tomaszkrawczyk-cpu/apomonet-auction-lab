<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tryb eksperta • ApoMonet</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="collection.html">Kolekcja</a><a class="active" href="expert.html">Tryb eksperta</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">Dom aukcyjny</span><h1>Tryb eksperta</h1><p>Wybierz pozycje, dodaj wspólną notatkę eksperta, oznacz je jako zweryfikowane i przygotuj do eksportu.</p></section><section class="card"><label>Wspólna notatka eksperta<textarea id="expertNote" class="input" rows="4" placeholder="Np. sprawdzono rant, wagę, średnicę lub odmianę..."></textarea></label><div class="toolbar"><button id="selectAll" class="btn secondary" type="button">Zaznacz wszystko</button><button id="clearAll" class="btn secondary" type="button">Odznacz wszystko</button><button id="verify" class="btn primary" type="button">Zapisz notatkę i zweryfikuj</button><button id="exportBtn" class="btn secondary" type="button">Eksportuj zaznaczone</button></div><div id="status" class="status"></div></section><section id="list" class="card" style="margin-top:14px"></section></main><script src="app.js"></script><script>const chosen=new Set();function coins(){return ApoMonet.load().coins||[]}function draw(){list.innerHTML=coins().map(c=>'<label class="event"><input type="checkbox" data-id="'+c.id+'" '+(chosen.has(c.id)?'checked':'')+'><div><strong>'+(c.title||'Moneta')+'</strong><p class="muted">'+[c.ruler,c.year,c.nominal,c.mint].filter(Boolean).join(' • ')+'</p></div><span class="badge">'+(c.expertVerified?'ZWERYFIKOWANA':'DO SPRAWDZENIA')+'</span></label>').join('')||'<div class="empty">Brak monet.</div>';list.querySelectorAll('input[data-id]').forEach(x=>x.onchange=()=>{x.checked?chosen.add(x.dataset.id):chosen.delete(x.dataset.id)})}selectAll.onclick=()=>{coins().forEach(c=>chosen.add(c.id));draw()};clearAll.onclick=()=>{chosen.clear();draw()};verify.onclick=()=>{if(!chosen.size){status.textContent='Najpierw zaznacz monety.';return}const note=expertNote.value.trim();for(const id of chosen){const c=ApoMonet.getCoin(id);if(c)ApoMonet.upsertCoin({...c,expertVerified:true,expertVerifiedAt:new Date().toISOString(),expertNote:note||c.expertNote||'',notes:[c.notes,note].filter(Boolean).join('\n')})}status.textContent='Zapisano weryfikację dla '+chosen.size+' pozycji.';draw()};exportBtn.onclick=()=>{if(!chosen.size){status.textContent='Najpierw zaznacz monety.';return}sessionStorage.setItem('apomonet_export_ids',JSON.stringify([...chosen]));location.href='export.html'};draw();</script></body></html>
