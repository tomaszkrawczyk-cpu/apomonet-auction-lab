<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tryb eksperta • ApoMonet</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="collection.html">Kolekcja</a><a class="active" href="expert.html">Tryb eksperta</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">Dom aukcyjny</span><h1>Tryb eksperta</h1><p>Wybierz pozycje, oznacz je jako zweryfikowane i przygotuj do eksportu.</p></section><div class="toolbar"><button id="verify" class="btn primary">Oznacz jako zweryfikowane</button><button id="exportBtn" class="btn secondary">Eksportuj zaznaczone</button></div><section id="list" class="card"></section></main><script src="app.js"></script><script>const s=ApoMonet.load(),chosen=new Set();function draw(){list.innerHTML=(s.coins||[]).map(c=>'<label class="event"><input type="checkbox" data-id="'+c.id+'" '+(chosen.has(c.id)?'checked':'')+'><div><strong>'+(c.title||'Moneta')+'</strong><p class="muted">'+[c.ruler,c.year,c.nominal,c.mint].filter(Boolean).join(' • ')+'</p></div><span class="badge">'+(c.expertVerified?'ZWERYFIKOWANA':'DO SPRAWDZENIA')+'</span></label>').join('')||'<div class="empty">Brak monet.</div>';list.querySelectorAll('input[data-id]').forEach(x=>x.onchange=()=>{x.checked?chosen.add(x.dataset.id):chosen.delete(x.dataset.id)})}verify.onclick=()=>{for(const id of chosen){const c=ApoMonet.getCoin(id);if(c)ApoMonet.upsertCoin({...c,expertVerified:true,expertVerifiedAt:new Date().toISOString()})}location.reload()};exportBtn.onclick=()=>{sessionStorage.setItem('apomonet_export_ids',JSON.stringify([...chosen]));location.href='export.html'};draw();</script></body></html>
