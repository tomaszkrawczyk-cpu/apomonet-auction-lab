<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ApoMonet Auction Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
      color: #c88a19;
    }

    .header p {
      margin-top: 8px;
      color: #999999;
      font-size: 15px;
    }

    .coin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .coin-card {
      background: #111111;
      border: 1px solid #444444;
      border-radius: 22px;
      padding: 14px;
      text-align: center;
    }

    .coin-card h2 {
      margin: 2px 0 16px;
      font-size: 22px;
      color: #c88a19;
    }

    .preview-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #080808;
      border: 2px dashed #555555;
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      position: relative;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #d9d9d9;
    }

    .placeholder {
      color: #777777;
      font-size: 14px;
      padding: 10px;
    }

    input[type="file"] {
      display: none;
    }

    .file-button {
      display: block;
      width: 100%;
      background: #090909;
      color: #ffffff;
      padding: 14px 8px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    .file-name {
      color: #777777;
      margin-top: 10px;
      font-size: 12px;
      min-height: 28px;
      word-break: break-word;
    }

    .analyze-button {
      width: 100%;
      border: none;
      background: #9b5f00;
      color: #ffffff;
      padding: 19px;
      border-radius: 20px;
      font-size: 22px;
      font-weight: bold;
      margin-top: 24px;
      cursor: pointer;
    }

    .analyze-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 22px;
      text-align: center;
      color: #999999;
      min-height: 24px;
      font-size: 18px;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: #111111;
      border: 1px solid #444444;
      border-radius: 18px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
    }

    @media (max-width: 520px) {
      .container {
        padding: 18px 12px 40px;
      }

      .header h1 {
        font-size: 28px;
      }

      .coin-grid {
        gap: 9px;
      }

      .coin-card {
        padding: 9px;
        border-radius: 18px;
      }

      .coin-card h2 {
        font-size: 18px;
      }

      .file-button {
        font-size: 14px;
        padding: 12px 5px;
      }

      .analyze-button {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>ApoMonet Auction Lab</h1>
      <p>Wersja demonstracyjna dla domów aukcyjnych</p>
    </div>

    <div class="coin-grid">

      <!-- AWERS -->
      <div class="coin-card">

        <h2>Awers</h2>

        <div class="preview-box">
          <span id="obversePlaceholder" class="placeholder">
            Dodaj zdjęcie awersu
          </span>

          <img
            id="obversePreview"
            alt="Podgląd awersu"
          />
        </div>

        <label for="obverseInput" class="file-button">
          Wybierz awers
        </label>

        <input
          id="obverseInput"
          type="file"
          accept="image/*"
        />

        <div id="obverseName" class="file-name">
          Nie wybrano zdjęcia
        </div>

      </div>

      <!-- REWERS -->
      <div class="coin-card">

        <h2>Rewers</h2>

        <div class="preview-box">
          <span id="reversePlaceholder" class="placeholder">
            Dodaj zdjęcie rewersu
          </span>

          <img
            id="reversePreview"
            alt="Podgląd rewersu"
          />
        </div>

        <label for="reverseInput" class="file-button">
          Wybierz rewers
        </label>

        <input
          id="reverseInput"
          type="file"
          accept="image/*"
        />

        <div id="reverseName" class="file-name">
          Nie wybrano zdjęcia
        </div>

      </div>

    </div>

    <button
      id="analyzeButton"
      class="analyze-button"
    >
      Analizuj monetę
    </button>

    <div id="status" class="status"></div>

    <div id="result" class="result"></div>

  </div>

  <script>

    let obverseFile = null;
    let reverseFile = null;

    const obverseInput =
      document.getElementById("obverseInput");

    const reverseInput =
      document.getElementById("reverseInput");

    const obversePreview =
      document.getElementById("obversePreview");

    const reversePreview =
      document.getElementById("reversePreview");

    const obversePlaceholder =
      document.getElementById("obversePlaceholder");

    const reversePlaceholder =
      document.getElementById("reversePlaceholder");

    const obverseName =
      document.getElementById("obverseName");

    const reverseName =
      document.getElementById("reverseName");

    const analyzeButton =
      document.getElementById("analyzeButton");

    const status =
      document.getElementById("status");

    const result =
      document.getElementById("result");


    /*
      ==================================
      PODGLĄD AWERSU
      ==================================
    */

    obverseInput.addEventListener(
      "change",
      function (event) {

        const file =
          event.target.files[0];

        if (!file) return;

        obverseFile = file;

        obverseName.textContent =
          file.name;

        const reader =
          new FileReader();

        reader.onload = function (e) {

          obversePreview.src =
            e.target.result;

          obversePreview.style.display =
            "block";

          obversePlaceholder.style.display =
            "none";
        };

        reader.readAsDataURL(file);
      }
    );


    /*
      ==================================
      PODGLĄD REWERSU
      ==================================
    */

    reverseInput.addEventListener(
      "change",
      function (event) {

        const file =
          event.target.files[0];

        if (!file) return;

        reverseFile = file;

        reverseName.textContent =
          file.name;

        const reader =
          new FileReader();

        reader.onload = function (e) {

          reversePreview.src =
            e.target.result;

          reversePreview.style.display =
            "block";

          reversePlaceholder.style.display =
            "none";
        };

        reader.readAsDataURL(file);
      }
    );


    /*
      ==================================
      KOMPRESJA ZDJĘCIA
      ==================================

      Maksymalny bok:
      1200 px

      JPEG quality:
      0.72

      To znacząco zmniejsza wagę zdjęcia
      przed wysłaniem do Vercela.
    */

    function compressImage(
      file,
      maxSize = 1200,
      quality = 0.72
    ) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();

          reader.onerror =
            reject;

          reader.onload = function (event) {

            const img =
              new Image();

            img.onerror =
              reject;

            img.onload = function () {

              let width =
                img.width;

              let height =
                img.height;

              if (
                width > maxSize ||
                height > maxSize
              ) {

                const ratio =
                  Math.min(
                    maxSize / width,
                    maxSize / height
                  );

                width =
                  Math.round(
                    width * ratio
                  );

                height =
                  Math.round(
                    height * ratio
                  );
              }

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;

              const ctx =
                canvas.getContext("2d");

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );

              const compressedData =
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                );

              resolve(
                compressedData
              );
            };

            img.src =
              event.target.result;
          };

          reader.readAsDataURL(
            file
          );
        }
      );
    }


    /*
      ==================================
      ANALIZA
      ==================================
    */

    analyzeButton.addEventListener(
      "click",
      async function () {

        if (!obverseFile) {

          alert(
            "Najpierw dodaj zdjęcie awersu."
          );

          return;
        }

        if (!reverseFile) {

          alert(
            "Dodaj również zdjęcie rewersu."
          );

          return;
        }

        try {

          analyzeButton.disabled =
            true;

          status.textContent =
            "Przygotowuję zdjęcia...";

          result.style.display =
            "none";

          result.textContent =
            "";


          /*
            Kompresujemy oba zdjęcia
            PRZED wysłaniem.
          */

          const obverseCompressed =
            await compressImage(
              obverseFile
            );

          const reverseCompressed =
            await compressImage(
              reverseFile
            );


          status.textContent =
            "Analizuję monetę...";


          const response =
            await fetch(
              "/api/analyze",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  obverse:
                    obverseCompressed,

                  reverse:
                    reverseCompressed,

                  images: [
                    obverseCompressed,
                    reverseCompressed
                  ]

                })
              }
            );


          const text =
            await response.text();


          if (!response.ok) {

            throw new Error(
              text ||
              "Błąd podczas analizy monety."
            );
          }


          let data;

          try {

            data =
              JSON.parse(text);

          } catch {

            data =
              text;
          }


          status.textContent =
            "Analiza zakończona.";


          result.style.display =
            "block";


          if (
            typeof data === "string"
          ) {

            result.textContent =
              data;

          } else if (
            data.result
          ) {

            result.textContent =
              typeof data.result === "string"
                ? data.result
                : JSON.stringify(
                    data.result,
                    null,
                    2
                  );

          } else if (
            data.analysis
          ) {

            result.textContent =
              typeof data.analysis === "string"
                ? data.analysis
                : JSON.stringify(
                    data.analysis,
                    null,
                    2
                  );

          } else {

            result.textContent =
              JSON.stringify(
                data,
                null,
                2
              );
          }


        } catch (error) {

          console.error(error);

          status.textContent =
            "Wystąpił błąd.";

          result.style.display =
            "block";

          result.textContent =
            error.message;

        } finally {

          analyzeButton.disabled =
            false;
        }

      }
    );

  </script>

</body>
</html>
