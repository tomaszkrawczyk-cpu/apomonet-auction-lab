<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b0d">

  <title>APOMONET AUCTION LAB</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

  <!-- HEADER -->

  <header class="hero">

    <div class="logo">

      <span class="coin-logo">1</span>

      <div>
        <h1>APOMONET</h1>
        <div class="lab">AUCTION LAB</div>
      </div>

    </div>

    <p>
      Profesjonalna analiza monet<br>
      dla domów aukcyjnych
    </p>

  </header>


  <!-- ZDJĘCIA -->

  <section class="panel">

    <div class="section-title">

      <span class="number">01</span>

      <div>
        <h2>Dodaj zdjęcia monety</h2>
        <p>Awers i rewers</p>
      </div>

    </div>


    <!-- UKRYTY WYBÓR ZDJĘĆ -->

    <input
      id="coinImages"
      type="file"
      accept="image/*"
      multiple
      style="
        position:absolute;
        width:1px;
        height:1px;
        opacity:0;
        overflow:hidden;
        pointer-events:none;
      "
    >


    <!-- KAFELKI ZDJĘĆ -->

    <div class="coin-sides">

      <!-- AWERS -->

      <label
        class="coin-side"
        for="coinImages"
      >

        <div
          id="obverseEmpty"
          class="empty-upload"
        >

          <div class="upload-icon">＋</div>

          <strong>AWERS</strong>

          <span>
            Dotknij i wybierz awers oraz rewers
          </span>

        </div>


        <img
          id="obversePreview"
          class="coin-preview"
          alt="Awers monety"
        >


        <div
          id="obverseBadge"
          class="photo-badge"
        >
          ✓ Awers
        </div>

      </label>


      <!-- REWERS -->

      <label
        class="coin-side"
        for="coinImages"
      >

        <div
          id="reverseEmpty"
          class="empty-upload"
        >

          <div class="upload-icon">＋</div>

          <strong>REWERS</strong>

          <span>
            Możesz zaznaczyć 2 zdjęcia jednocześnie
          </span>

        </div>


        <img
          id="reversePreview"
          class="coin-preview"
          alt="Rewers monety"
        >


        <div
          id="reverseBadge"
          class="photo-badge"
        >
          ✓ Rewers
        </div>

      </label>

    </div>


    <!-- LICZNIK -->

    <div class="photo-counter">

      <span id="photoStatus">
        Dodaj przynajmniej jedno zdjęcie
      </span>

      <strong id="photoCount">
        0 / 2
      </strong>

    </div>


    <!-- PRZYCISK ANALIZY -->

    <button
      id="analyzeBtn"
      class="analyze-button analyze-btn"
      type="button"
      disabled
    >

      <span>✦</span>

      <span id="buttonText">
        Analizuj monetę
      </span>

    </button>


    <div
      id="status"
      class="status"
    ></div>

  </section>



  <!-- PANEL WYNIKU -->

  <section
    id="resultPanel"
    class="result-panel hidden"
  >

    <div class="result-header">

      <div>

        <div class="result-small">
          WYNIK ANALIZY
        </div>

        <h2 id="coinTitle">
          Analiza monety
        </h2>

      </div>


      <div class="confidence">

        <strong id="confidence">
          —
        </strong>

        <span>
          Pewność
        </span>

      </div>

    </div>



    <!-- IDENTYFIKACJA -->

    <div class="result-section">

      <h3>
        Identyfikacja
      </h3>


      <div class="data-grid">

        <div class="data-item">

          <span>
            Nominał
          </span>

          <strong id="nominal">
            —
          </strong>

        </div>


        <div class="data-item">

          <span>
            Władca / emitent
          </
