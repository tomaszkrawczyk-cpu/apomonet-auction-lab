<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApoMonet Auction Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d0d0d;
      color: #fff;
    }
    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 22px 14px 50px;
    }
    .header { text-align: center; margin-bottom: 22px; }
    .header h1 { margin: 0; font-size: 30px; color: #c88a19; }
    .header p { margin: 8px 0 0; color: #999; font-size: 14px; }
    input[type="file"] { display: none; }
    .picker {
      display: block;
      border: 2px dashed #555;
      border-radius: 22px;
      padding: 14px;
      background: #111;
      cursor: pointer;
    }
    .picker-title {
      text-align: center;
      font-weight: 700;
      font-size: 17px;
      margin-bottom: 12px;
      color: #fff;
    }
    .coin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .coin-card {
      background: #0a0a0a;
      border-radius: 18px;
      padding: 9px;
      text-align: center;
      border: 1px solid #333;
    }
    .coin-card h2 {
      margin: 3px 0 9px;
      font-size: 18px;
      color: #c88a19;
    }
    .preview-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 15px;
      overflow: hidden;
      background: #060606;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #d7d7d7;
    }
    .placeholder {
      color: #777;
      font-size: 13px;
      padding: 12px 6px;
    }
    .hint {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 10px;
    }
    .swap-button {
      width: 100%;
      margin-top: 10px;
      border: 1px solid #444;
      background: #181818;
      color: #ddd;
      padding: 11px;
      border-radius: 12px;
      font-weight: 700;
      display: none;
    }
    .analyze-button {
      width: 100%;
      border: 0;
      background: #9b5f00;
      color: #fff;
      padding: 18px;
      border-radius: 18px;
      font-size: 21px;
      font-weight: 700;
      margin-top: 18px;
      cursor: pointer;
    }
    .analyze-button:disabled { opacity: .5; }
    .status {
      margin-top: 18px;
      text-align: center;
      color: #aaa;
      min-height: 24px;
      font-size: 16px;
    }
    .result {
      margin-top: 18px;
      padding: 18px;
      background: #111;
      border: 1px solid #333;
      border-radius: 16px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      font-size: 14px;
    }
    @media (max-width: 520px) {
      .container { padding: 16px 10px 38px; }
      .header h1 { font-size: 27px; }
      .picker { padding: 10px; }
      .coin-grid { gap: 8px; }
      .coin-card { padding: 7px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ApoMonet Auction Lab</h1>
      <p>Wersja demonstracyjna dla domów aukcyjnych</p>
    </div>

    <label class="picker" for="coinImagesInput">
      <div class="picker-title">Dotknij tutaj i wybierz 2 zdjęcia naraz</div>
      <div class="coin-grid">
        <div class="coin-card">
          <h2>Awers</h2>
          <div class="preview-box">
            <span id="obversePlaceholder" class="placeholder">Pierwsze zdjęcie</span>
            <img id="obversePreview" alt="Podgląd awersu" />
          </div>
        </div>
        <div class="coin-card">
          <h2>Rewers</h2>
          <div class="preview-box">
            <span id="reversePlaceholder" class="placeholder">Drugie zdjęcie</span>
            <img id="reversePreview" alt="Podgląd rewersu" />
          </div>
        </div>
      </div>
      <div class="hint">Zaznacz awers jako pierwszy, rewers jako drugi.</div>
    </label>

    <input id="coinImagesInput" type="file" accept="image/*" multiple />
    <button id="swapButton" class="swap-button" type="button">Zamień awers ↔ rewers</button>
    <button id="analyzeButton" class="analyze-button" type="button">Analizuj monetę</button>
    <div id="status" class="status"></div>
    <div id="result" class="result"></div>
  </div>

  <script>
    let obverseFile = null;
    let reverseFile = null;

    const input = document.getElementById("coinImagesInput");
    const obversePreview = document.getElementById("obversePreview");
    const reversePreview = document.getElementById("reversePreview");
    const obversePlaceholder = document.getElementById("obversePlaceholder");
    const reversePlaceholder = document.getElementById("reversePlaceholder");
    const swapButton = document.getElementById("swapButton");
    const analyzeButton = document.getElementById("analyzeButton");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    function showPreview(file, img, placeholder) {
      const reader = new FileReader();
      reader.onload = e => {
        img.src = e.target.result;
        img.style.display = "block";
        placeholder.style.display = "none";
      };
      reader.readAsDataURL(file);
    }

    function refreshPreviews() {
      if (obverseFile) showPreview(obverseFile, obversePreview, obversePlaceholder);
      if (reverseFile) showPreview(reverseFile, reversePreview, reversePlaceholder);
      swapButton.style.display = obverseFile && reverseFile ? "block" : "none";
    }

    input.addEventListener("change", () => {
      const files = Array.from(input.files || []);
      if (!files.length) return;

      if (files.length < 2) {
        status.textContent = "Wybierz dwa zdjęcia jednocześnie: awers i rewers.";
        return;
      }

      obverseFile = files[0];
      reverseFile = files[1];
      status.textContent = "Dwa zdjęcia gotowe do analizy.";
      refreshPreviews();
    });

    swapButton.addEventListener("click", event => {
      event.preventDefault();
      const tmp = obverseFile;
      obverseFile = reverseFile;
      reverseFile = tmp;

      obversePreview.style.display = "none";
      reversePreview.style.display = "none";
      obversePlaceholder.style.display = "flex";
      reversePlaceholder.style.display = "flex";
      refreshPreviews();
    });

    function compressImage(file, maxSize = 1100, quality = 0.68) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = event => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxSize || height > maxSize) {
              const ratio = Math.min(maxSize / width, maxSize / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function formatAnalysis(a) {
      const lines = [
        `Moneta: ${a.title || "Nie ustalono"}`,
        `Nominał: ${a.nominal || "Nie ustalono"}`,
        `Władca / emitent: ${a.ruler || "Nie ustalono"}`,
        `Rok: ${a.year || "Nie ustalono"}`,
        `Odczyt daty ze zdjęcia: ${a.visibleDateReading || "Nie ustalono"}`,
        `Mennica: ${a.mint || "Nie ustalono"}`,
        `Odmiana: ${a.variant || "Nie ustalono"}`,
        `Stan: ${a.grade || "Nie ustalono"}`,
        `Rzadkość: ${a.rarity || "Nie ustalono"}`,
        `Wycena: ${a.estimatedPrice || "Nie ustalono"}`,
        `Zakres aukcyjny: ${a.priceRange || "Nie ustalono"}`,
        `Pewność: ${Number.isFinite(a.confidence) ? a.confidence + "%" : "Nie ustalono"}`,
        `Legenda awersu: ${a.obverseLegend || "Nie ustalono"}`,
        `Legenda rewersu: ${a.reverseLegend || "Nie ustalono"}`
      ];

      if (Array.isArray(a.evidenceSummary) && a.evidenceSummary.length) {
        lines.push("\nDowody:", ...a.evidenceSummary.map(x => `• ${x}`));
      }
      if (Array.isArray(a.alternatives) && a.alternatives.length) {
        lines.push("\nAlternatywy:", ...a.alternatives.map(x => `• ${x}`));
      }
      if (Array.isArray(a.warnings) && a.warnings.length) {
        lines.push("\nUwagi:", ...a.warnings.map(x => `• ${x}`));
      }
      return lines.join("\n");
    }

    analyzeButton.addEventListener("click", async () => {
      if (!obverseFile || !reverseFile) {
        alert("Wybierz dwa zdjęcia monety naraz: awers i rewers.");
        return;
      }

      try {
        analyzeButton.disabled = true;
        result.style.display = "none";
        status.textContent = "Przygotowuję zdjęcia...";

        const [obverse, reverse] = await Promise.all([
          compressImage(obverseFile),
          compressImage(reverseFile)
        ]);

        status.textContent = "Analizuję monetę...";

        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ images: [obverse, reverse] })
        });

        const text = await response.text();
        let data;
        try { data = JSON.parse(text); } catch { data = null; }

        if (!response.ok) {
          throw new Error(data?.error || text || "Błąd podczas analizy monety.");
        }

        status.textContent = "Analiza zakończona.";
        result.style.display = "block";
        result.textContent = data?.analysis ? formatAnalysis(data.analysis) : text;
      } catch (error) {
        console.error(error);
        status.textContent = "Wystąpił błąd.";
        result.style.display = "block";
        result.textContent = error?.message || "Nie udało się połączyć z serwerem.";
      } finally {
        analyzeButton.disabled = false;
      }
    });
  </script>
</body>
</html>
