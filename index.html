<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ApoMonet Auction Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
      color: #f5c542;
    }

    .header p {
      margin-top: 8px;
      color: #bbbbbb;
      font-size: 15px;
    }

    .coin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .coin-card {
      background: #181818;
      border: 1px solid #333333;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .coin-card h2 {
      margin: 2px 0 12px;
      font-size: 18px;
      color: #f5c542;
    }

    .preview-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #0b0b0b;
      border: 2px dashed #444444;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      position: relative;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .placeholder {
      color: #777777;
      font-size: 14px;
      padding: 10px;
    }

    input[type="file"] {
      display: none;
    }

    .file-button {
      display: block;
      width: 100%;
      background: #2b2b2b;
      color: #ffffff;
      padding: 12px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .file-button:active {
      transform: scale(0.98);
    }

    .file-name {
      color: #999999;
      margin-top: 8px;
      font-size: 12px;
      min-height: 16px;
      word-break: break-word;
    }

    .analyze-button {
      width: 100%;
      border: none;
      background: #f5c542;
      color: #111111;
      padding: 17px;
      border-radius: 13px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 22px;
      cursor: pointer;
    }

    .analyze-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .analyze-button:active {
      transform: scale(0.99);
    }

    .status {
      margin-top: 18px;
      text-align: center;
      color: #bbbbbb;
      min-height: 24px;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #181818;
      border: 1px solid #333333;
      border-radius: 14px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      .container {
        padding: 18px 12px 40px;
      }

      .header h1 {
        font-size: 27px;
      }

      .coin-grid {
        gap: 9px;
      }

      .coin-card {
        padding: 9px;
        border-radius: 13px;
      }

      .coin-card h2 {
        font-size: 16px;
      }

      .file-button {
        font-size: 13px;
        padding: 11px 5px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>ApoMonet Auction Lab</h1>
      <p>Wersja demonstracyjna dla domów aukcyjnych</p>
    </div>

    <div class="coin-grid">

      <!-- AWERS -->
      <div class="coin-card">

        <h2>Awers</h2>

        <div class="preview-box">
          <span
            class="placeholder"
            id="obversePlaceholder"
          >
            Dodaj zdjęcie awersu
          </span>

          <img
            id="obversePreview"
            alt="Podgląd awersu"
          />
        </div>

        <label
          for="obverseInput"
          class="file-button"
        >
          Wybierz awers
        </label>

        <input
          id="obverseInput"
          type="file"
          accept="image/*"
        />

        <div
          class="file-name"
          id="obverseName"
        >
          Nie wybrano zdjęcia
        </div>

      </div>


      <!-- REWERS -->
      <div class="coin-card">

        <h2>Rewers</h2>

        <div class="preview-box">
          <span
            class="placeholder"
            id="reversePlaceholder"
          >
            Dodaj zdjęcie rewersu
          </span>

          <img
            id="reversePreview"
            alt="Podgląd rewersu"
          />
        </div>

        <label
          for="reverseInput"
          class="file-button"
        >
          Wybierz rewers
        </label>

        <input
          id="reverseInput"
          type="file"
          accept="image/*"
        />

        <div
          class="file-name"
          id="reverseName"
        >
          Nie wybrano zdjęcia
        </div>

      </div>

    </div>


    <button
      id="analyzeButton"
      class="analyze-button"
    >
      Analizuj monetę
    </button>


    <div
      id="status"
      class="status"
    ></div>


    <div
      id="result"
      class="result"
    ></div>

  </div>


  <script>

    /*
      WAŻNE:

      AWERS i REWERS mają osobne zmienne.

      Dzięki temu wybranie rewersu
      NIE NADPISUJE awersu.
    */

    let obverseFile = null;
    let reverseFile = null;


    const obverseInput =
      document.getElementById("obverseInput");

    const reverseInput =
      document.getElementById("reverseInput");


    const obversePreview =
      document.getElementById("obversePreview");

    const reversePreview =
      document.getElementById("reversePreview");


    const obversePlaceholder =
      document.getElementById("obversePlaceholder");

    const reversePlaceholder =
      document.getElementById("reversePlaceholder");


    const obverseName =
      document.getElementById("obverseName");

    const reverseName =
      document.getElementById("reverseName");


    const analyzeButton =
      document.getElementById("analyzeButton");

    const status =
      document.getElementById("status");

    const result =
      document.getElementById("result");



    /*
      ================================
      AWERS
      ================================
    */

    obverseInput.addEventListener(
      "change",
      function (event) {

        const file =
          event.target.files[0];

        if (!file) {
          return;
        }

        obverseFile = file;

        obverseName.textContent =
          file.name;

        const reader =
          new FileReader();

        reader.onload = function (e) {

          obversePreview.src =
            e.target.result;

          obversePreview.style.display =
            "block";

          obversePlaceholder.style.display =
            "none";
        };

        reader.readAsDataURL(file);
      }
    );



    /*
      ================================
      REWERS
      ================================
    */

    reverseInput.addEventListener(
      "change",
      function (event) {

        const file =
          event.target.files[0];

        if (!file) {
          return;
        }

        reverseFile = file;

        reverseName.textContent =
          file.name;

        const reader =
          new FileReader();

        reader.onload = function (e) {

          reversePreview.src =
            e.target.result;

          reversePreview.style.display =
            "block";

          reversePlaceholder.style.display =
            "none";
        };

        reader.readAsDataURL(file);
      }
    );



    /*
      Zamiana zdjęcia na Base64
    */

    function fileToBase64(file) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();

          reader.onload = () =>
            resolve(reader.result);

          reader.onerror = reject;

          reader.readAsDataURL(file);
        }
      );
    }



    /*
      ================================
      ANALIZA MONETY
      ================================
    */

    analyzeButton.addEventListener(
      "click",
      async function () {

        if (!obverseFile) {

          alert(
            "Najpierw dodaj zdjęcie awersu."
          );

          return;
        }


        if (!reverseFile) {

          alert(
            "Dodaj również zdjęcie rewersu."
          );

          return;
        }


        try {

          analyzeButton.disabled =
            true;

          status.textContent =
            "Analizuję monetę...";

          result.style.display =
            "none";

          result.textContent =
            "";


          const obverseBase64 =
            await fileToBase64(
              obverseFile
            );


          const reverseBase64 =
            await fileToBase64(
              reverseFile
            );


          /*
            Wysyłamy DWA oddzielne zdjęcia
            do naszego /api/analyze
          */

          const response =
            await fetch(
              "/api/analyze",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  obverse:
                    obverseBase64,

                  reverse:
                    reverseBase64,

                  images: [
                    obverseBase64,
                    reverseBase64
                  ]

                })
              }
            );


          const text =
            await response.text();


          if (!response.ok) {

            throw new Error(
              text ||
              "Błąd podczas analizy monety."
            );
          }


          let data;

          try {

            data =
              JSON.parse(text);

          } catch {

            data =
              text;
          }


          status.textContent =
            "Analiza zakończona.";


          result.style.display =
            "block";


          if (
            typeof data === "string"
          ) {

            result.textContent =
              data;

          } else if (
            data.result
          ) {

            result.textContent =
              typeof data.result === "string"
                ? data.result
                : JSON.stringify(
                    data.result,
                    null,
                    2
                  );

          } else if (
            data.analysis
          ) {

            result.textContent =
              typeof data.analysis === "string"
                ? data.analysis
                : JSON.stringify(
                    data.analysis,
                    null,
                    2
                  );

          } else {

            result.textContent =
              JSON.stringify(
                data,
                null,
                2
              );
          }


        } catch (error) {

          console.error(error);

          status.textContent =
            "Wystąpił błąd.";

          result.style.display =
            "block";

          result.textContent =
            error.message;

        } finally {

          analyzeButton.disabled =
            false;
        }

      }
    );

  </script>

</body>
</html>
