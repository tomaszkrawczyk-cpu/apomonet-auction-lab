<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostyka • ApoMonet</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><section class="hero compact"><span class="eyebrow">INTERNAL</span><h1>Diagnostyka APOMONET</h1><p>Kontrola załadowania kluczowych modułów, migracji danych i granic bezpieczeństwa źródeł.</p></section><section id="list" class="card"></section><section class="card" style="margin-top:14px"><h2>Stan danych lokalnych</h2><div id="dataState"></div></section><section class="card" style="margin-top:14px"><h2>Integracje</h2><div id="integrations"><div class="event"><strong>Europeana</strong><span class="badge">SPRAWDZAM…</span></div></div></section></main><script src="app.js"></script><script src="knowledge-builder-core.js"></script><script src="open-concepts-core.js"></script><script src="auction-cost-core.js"></script><script>const fakeGood={source:'WIKIDATA',sourceUrl:'https://www.wikidata.org/wiki/Q1',ruler:'Test',year:'1900'},fakeBad={source:'NIEMCZYK',sourceUrl:'https://example.invalid',ruler:'Test',year:'1900'};const checks=[['ApoMonet core',()=>!!window.ApoMonet],['Katalog numizmatyczny',()=>!!window.ApoNumis],['Verified → katalog',()=>!!window.ApoVerifiedCatalog],['Archiwum aukcyjne',()=>!!window.ApoArchive],['XLSX',()=>!!window.ApoXLSXPackage],['Cele / alerty',()=>!!window.ApoAuctionAlerts],['Akcje aukcyjne',()=>!!window.ApoAuctionActions],['Prywatność eksportu',()=>!!window.ApoExportPrivacy],['Knowledge Builder',()=>!!window.ApoKnowledge],['Zweryfikowana wiedza',()=>!!window.ApoVerifiedKnowledge],['Otwarte dane',()=>!!window.ApoOpenConcepts],['Koszty aukcji PRO',()=>!!window.ApoAuctionCost],['Języki',()=>!!window.ApoI18n],['Domyślne albumy',()=>{const a=window.ApoMonet?.load?.().albums||[];return ['my-album','goals','dreams'].every(id=>a.some(x=>x.id===id))}],['Cele widoczne dla alertów',()=>Array.isArray(window.ApoAuctionAlerts?.targetsFromWatchlist?.())],['Whitelist przepuszcza zielone',()=>ApoKnowledge.sourceAllows(fakeGood)],['Whitelist blokuje czerwone',()=>!ApoKnowledge.sourceAllows(fakeBad)],['Verified blokuje niedozwolone provenance',()=>!ApoVerifiedKnowledge.itemAllowed({provenance:[fakeBad]})]];list.innerHTML=checks.map(([n,f])=>{let ok=false;try{ok=!!f()}catch{}return '<div class="event"><strong>'+n+'</strong><span class="badge">'+(ok?'OK':'BRAK')+'</span></div>'}).join('');const s=window.ApoMonet?.load?.()||{};dataState.innerHTML='<div class="event"><div><strong>Kolekcja</strong><p class="muted">Monety: '+(s.coins||[]).length+' • Albumy: '+(s.albums||[]).length+' • Cele alertów: '+(window.ApoAuctionAlerts?.targetsFromWatchlist?.().length||0)+'</p></div></div><div class="event"><div><strong>Wiedza</strong><p class="muted">Verified: '+(window.ApoVerifiedKnowledge?.load?.().length||0)+' • Typy katalogowe aktywne: '+(window.ApoNumis?.types?.length||0)+' • Otwarte pojęcia: '+(window.ApoOpenConcepts?.load?.().length||0)+'</p></div></div>';fetch('/api/europeana?health=1').then(r=>r.json()).then(x=>{integrations.innerHTML='<div class="event"><div><strong>Europeana Record API</strong><p class="muted">Adapter: '+(x.adapter||'—')+'</p></div><span class="badge">'+(x.configured?'KLUCZ OK':'CZEKA NA KLUCZ')+'</span></div>'}).catch(()=>{integrations.innerHTML='<div class="event"><strong>Europeana Record API</strong><span class="badge">BŁĄD TESTU</span></div>'});</script></body></html>
