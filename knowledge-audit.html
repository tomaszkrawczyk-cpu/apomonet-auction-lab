<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audyt wiedzy • ApoMonet</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="knowledge-add.html">Dodaj obserwację</a><a href="knowledge-consensus.html">Konsensus</a><a class="active" href="knowledge-audit.html">Audyt</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">APOMONET LAB</span><h1>Audyt sprzeczności</h1><p>Rozbieżności między źródłami trafiają do ręcznej weryfikacji. APOMONET nie rozstrzyga ich automatycznie.</p></section><section id="list" class="card"></section></main><script src="knowledge-builder-core.js"></script><script src="knowledge-audit.js"></script><script>const rows=ApoKnowledgeAudit.audit();list.innerHTML=rows.length?rows.map(x=>'<div class="event"><div><strong>'+x.rows.map(r=>[r.ruler,r.year,r.nominal,r.mint].filter(Boolean).join(' • '))[0]+'</strong><p class="muted">Źródła: '+x.sources.join(', ')+' • odmiany: '+(x.variant.join(' | ')||'—')+' • katalog: '+(x.catalog.join(' | ')||'—')+' • rzadkość: '+(x.rarity.join(' | ')||'—')+'</p></div><span class="badge">'+(x.status==='review'?'DO WERYFIKACJI':'ZGODNE')+'</span></div>').join(''):'<div class="empty">Brak danych do audytu.</div>';</script></body></html>
