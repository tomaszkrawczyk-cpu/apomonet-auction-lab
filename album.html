<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Album • ApoMonet</title><link rel="stylesheet" href="style.css"><style>.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}.viewbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.viewbtn.active{border-color:#b87918;color:#e8a33a}.coin-list{display:grid;gap:12px}.coin-list.small{grid-template-columns:repeat(2,minmax(0,1fr))}.coin-list.large{grid-template-columns:1fr}.coin-card{position:relative;overflow:hidden}.coin-photo{width:100%;height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;background:radial-gradient(circle at 50% 45%,#272729,#111 72%);border-radius:14px}.coin-photo img{width:132px;height:132px;object-fit:contain;border-radius:50%;filter:drop-shadow(0 5px 8px #000)}.coin-list.small .coin-photo{height:105px}.coin-list.small .coin-photo img{width:92px;height:92px}.coin-list.large .coin-photo{height:220px}.coin-list.large .coin-photo img{width:200px;height:200px}.coin-list.list .coin-card{min-height:118px;padding-left:132px}.coin-list.list .coin-photo{position:absolute;left:14px;top:14px;width:100px;height:100px;margin:0}.coin-list.list .coin-photo img{width:88px;height:88px}.coin-placeholder{width:112px;height:112px;border-radius:50%;border:3px solid #a9742a;background:radial-gradient(circle,#b7b7b7 0 57%,#696969 59% 64%,#222 66%);display:flex;align-items:center;justify-content:center;text-align:center;color:#222;font-size:11px;font-weight:800;padding:12px}.coin-list.small .coin-placeholder{width:82px;height:82px;font-size:9px}.coin-list.large .coin-placeholder{width:180px;height:180px;font-size:14px}.coin-list.list .coin-placeholder{width:80px;height:80px;font-size:9px}.demo{font-size:10px;color:#d99732}.result-count{color:#999;font-size:13px;margin:8px 0 12px}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:430px){.coin-list.small{grid-template-columns:1fr 1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="albums.html">← Albumy</a><a href="collection.html">Kolekcja</a><a href="analyze.html">Analiza</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">Album demonstracyjny</span><h1>Historia Polski w monetach</h1><p>Przykładowa kolekcja od pierwszych Piastów po współczesność. Miniatury pokazują docelowy układ albumu; zdjęcia źródłowe dodajemy tylko tam, gdzie mamy bezpieczny materiał.</p></section><div class="filters"><select id="ruler" class="input"><option value="">Wszyscy władcy</option></select><select id="nominal" class="input"><option value="">Wszystkie nominały</option></select><select id="mint" class="input"><option value="">Wszystkie mennice</option></select><select id="era" class="input"><option value="">Wszystkie epoki</option></select></div><div class="viewbar"><button class="btn secondary viewbtn" data-view="list">Lista</button><button class="btn secondary viewbtn" data-view="small">Małe kafelki</button><button class="btn secondary viewbtn" data-view="large">Duże kafelki</button><button id="reset" class="btn secondary">Wyczyść filtry</button></div><div id="resultCount" class="result-count"></div><section id="coinList" class="coin-list"></section></main><nav class="bottom-nav"><a href="index.html">Start</a><a href="analyze.html">Analiza</a><a href="collection.html">Kolekcja</a><a href="calendar.html">Aukcje</a><a class="active" href="albums.html">Albumy</a></nav><script src="app.js"></script><script>

const $=x=>document.getElementById(x),fields=['ruler','nominal','mint','era'];function fill(id){const el=$(id);[...new Set(demo.map(x=>x[id]))].sort().forEach(v=>el.insertAdjacentHTML('beforeend',`<option>${v}</option>`))}fields.forEach(fill);let view=localStorage.getItem('apomonet_album_view')||'small';function photo(c){return c.img?`<div class="coin-photo"><img src="${c.img}" alt="${c.title} — ${c.ruler}" loading="lazy" referrerpolicy="no-referrer"></div>`:`<div class="coin-photo"><div class="coin-placeholder">${c.nominal}<br>${c.year}</div></div>`}function render(){const items=demo.filter(c=>fields.every(f=>!$(f).value||c[f]===$(f).value));$('resultCount').textContent=`Pokazano ${items.length} z ${demo.length} monet`;$('coinList').className='coin-list '+view;$('coinList').innerHTML=items.map(c=>`<article class="card coin-card">${photo(c)}<span class="demo">PRZYKŁAD</span> <span class="eyebrow">${c.year}</span><h2>${c.title}</h2><p><strong>${c.ruler}</strong></p><p>${c.nominal} • ${c.mint}</p><p class="muted">${c.era} • ${c.metal}</p></article>`).join('')||'<div class="empty">Brak monet spełniających wybrane filtry.</div>';document.querySelectorAll('.viewbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}fields.forEach(f=>$(f).onchange=render);document.querySelectorAll('.viewbtn').forEach(b=>b.onclick=()=>{view=b.dataset.view;localStorage.setItem('apomonet_album_view',view);render()});$('reset').onclick=()=>{fields.forEach(f=>$(f).value='');render()};render();
