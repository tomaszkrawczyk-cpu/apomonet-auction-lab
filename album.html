<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Album • ApoMonet</title><link rel="stylesheet" href="style.css"><style>.coin-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.coin-row input{width:20px;height:20px}.danger{background:#2b1111!important;border-color:#5a2323!important}.hidden{display:none!important}.modal-bg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(520px,100%);background:#111113;border:1px solid #333;border-radius:22px;padding:20px}.album-option{width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:13px;border:1px solid #333;background:#18181b;color:#fff}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="albums.html">← Albumy</a><a href="collection.html">Kolekcja</a><a href="analyze.html">Analiza</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">Album</span><h1 id="albumTitle">Album</h1><p id="albumDescription"></p></section><div class="toolbar"><a class="btn primary" href="collection.html">+ Dodaj monetę</a><button id="manage" class="btn secondary" type="button">Zaznacz monety</button><button id="moveSelected" class="btn secondary hidden" type="button">Przenieś do albumu</button><button id="removeSelected" class="btn secondary danger hidden" type="button">Usuń z tego albumu</button></div><section id="coinList" class="grid"></section><div class="section-title"><h2>Statystyki albumu</h2></div><section class="grid two"><div class="card"><div id="count" class="kpi">0</div><p>monet w albumie</p></div><div class="card"><div class="kpi">—</div><p>łączna wycena</p></div></section></main><div id="moveModal" class="modal-bg hidden"><div class="modal"><div class="section-title"><h2>Przenieś do albumu</h2><button id="closeMove" class="btn secondary">Anuluj</button></div><div id="targetAlbums"></div></div></div><script src="app.js"></script><script>const $=x=>document.getElementById(x),albumId=new URLSearchParams(location.search).get('id');let selecting=false;function selectedIds(){return[...document.querySelectorAll('.pick:checked')].map(x=>x.value)}function render(){const s=ApoMonet.load(),album=s.albums.find(x=>x.id===albumId);$('albumTitle').textContent=album?.name||'Album';$('albumDescription').textContent=album?.description||'';const coins=s.coins.filter(c=>(c.albumIds||[]).includes(albumId));$('count').textContent=coins.length;$('coinList').innerHTML=coins.length?coins.map(c=>`<article class="card coin-row"><input class="pick ${selecting?'':'hidden'}" type="checkbox" value="${c.id}"><div>${c.obverseImage?`<img src="${c.obverseImage}" alt="Awers" style="width:70px;height:70px;object-fit:contain;border-radius:50%;float:right">`:''}<span class="eyebrow">${c.year||'Rok nieustalony'}</span><h2>${c.title||'Moneta'}</h2><p>${[c.nominal,c.ruler,c.mint].filter(Boolean).join(' • ')||'Dane do uzupełnienia'}</p></div><a class="btn secondary" href="coin-edit.html?id=${encodeURIComponent(c.id)}">Otwórz</a></article>`).join(''):'<div class="empty">Ten album jest pusty.</div>';$('moveSelected').classList.toggle('hidden',!selecting);$('removeSelected').classList.toggle('hidden',!selecting)}$('manage').onclick=()=>{selecting=!selecting;render()};$('removeSelected').onclick=()=>{const ids=selectedIds();if(!ids.length)return alert('Najpierw zaznacz monety.');if(!confirm(`Usunąć ${ids.length} zaznaczon${ids.length===1?'ą monetę':'e monety'} z tego albumu? Monety pozostaną w kolekcji.`))return;ids.forEach(id=>ApoMonet.removeCoinFromAlbum(id,albumId));render()};$('moveSelected').onclick=()=>{const ids=selectedIds();if(!ids.length)return alert('Najpierw zaznacz monety.');const s=ApoMonet.load(),targets=s.albums.filter(x=>x.id!==albumId);if(!targets.length)return alert('Nie ma innego albumu. Najpierw utwórz nowy album.');$('targetAlbums').innerHTML=targets.map(a=>`<button class="album-option" data-id="${a.id}"><strong>${a.name}</strong><br><span>${a.description||''}</span></button>`).join('');$('moveModal').classList.remove('hidden');document.querySelectorAll('.album-option').forEach(btn=>btn.onclick=()=>{const target=btn.dataset.id,targetName=btn.querySelector('strong').textContent;if(!confirm(`Przenieść ${ids.length} zaznaczon${ids.length===1?'ą monetę':'e monety'} do albumu „${targetName}”?`))return;ids.forEach(id=>ApoMonet.moveCoinBetweenAlbums(id,albumId,target));$('moveModal').classList.add('hidden');selecting=false;render()})};$('closeMove').onclick=()=>$('moveModal').classList.add('hidden');render();</script></body></html>
