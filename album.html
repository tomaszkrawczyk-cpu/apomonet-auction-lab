<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Album • ApoMonet</title><link rel="stylesheet" href="style.css"><style>.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}.viewbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.viewbtn.active{border-color:#b87918;color:#e8a33a}.coin-list{display:grid;gap:12px}.coin-list.small{grid-template-columns:repeat(2,minmax(0,1fr))}.coin-list.large{grid-template-columns:1fr}.coin-card{position:relative}.coin-list.small .coin-card h2{font-size:17px}.coin-list.small .coin-card p{font-size:12px}.coin-img{width:92px;height:92px;object-fit:contain;border-radius:50%;float:right;margin-left:8px;background:#171719}.coin-list.small .coin-img{width:72px;height:72px}.coin-list.large .coin-img{width:135px;height:135px}.demo{font-size:11px;color:#d99732}.result-count{color:#999;font-size:13px;margin:8px 0 12px}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:430px){.coin-list.small{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="albums.html">← Albumy</a><a href="collection.html">Kolekcja</a><a href="analyze.html">Analiza</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">Album demonstracyjny</span><h1>Przykładowa kolekcja</h1><p>Test układu i filtrowania według mennicy, nominału, władcy i epoki. Dane poniżej są przykładami demonstracyjnymi.</p></section><div class="filters"><select id="ruler" class="input"><option value="">Wszyscy władcy</option></select><select id="nominal" class="input"><option value="">Wszystkie nominały</option></select><select id="mint" class="input"><option value="">Wszystkie mennice</option></select><select id="era" class="input"><option value="">Wszystkie epoki</option></select></div><div class="viewbar"><button class="btn secondary viewbtn" data-view="list">Lista</button><button class="btn secondary viewbtn" data-view="small">Małe kafelki</button><button class="btn secondary viewbtn" data-view="large">Duże kafelki</button><button id="reset" class="btn secondary">Wyczyść filtry</button></div><div id="resultCount" class="result-count"></div><section id="coinList" class="coin-list"></section></main><nav class="bottom-nav"><a href="index.html">Start</a><a href="analyze.html">Analiza</a><a href="collection.html">Kolekcja</a><a href="calendar.html">Aukcje</a><a class="active" href="albums.html">Albumy</a></nav><script src="app.js"></script><script>
const demo=[
{year:'1551',title:'Dwutalar',nominal:'Dwutalar',ruler:'Zygmunt II August',mint:'Wilno',era:'Jagiellonowie',metal:'Srebro'},
{year:'1580',title:'Talar koronny',nominal:'Talar',ruler:'Stefan Batory',mint:'Olkusz',era:'Rzeczpospolita Obojga Narodów',metal:'Srebro'},
{year:'1621',title:'Ort koronny',nominal:'Ort',ruler:'Zygmunt III Waza',mint:'Bydgoszcz',era:'Wazowie',metal:'Srebro'},
{year:'1623',title:'Trojak koronny',nominal:'Trojak',ruler:'Zygmunt III Waza',mint:'Kraków',era:'Wazowie',metal:'Srebro'},
{year:'1668',title:'Ort koronny',nominal:'Ort',ruler:'Jan II Kazimierz',mint:'Bydgoszcz',era:'Wazowie',metal:'Srebro'},
{year:'1683',title:'Szóstak koronny',nominal:'Szóstak',ruler:'Jan III Sobieski',mint:'Kraków',era:'Rzeczpospolita Obojga Narodów',metal:'Srebro'},
{year:'1766',title:'Talar koronny',nominal:'Talar',ruler:'Stanisław August Poniatowski',mint:'Warszawa',era:'Stanisławowska',metal:'Srebro'},
{year:'1794',title:'Złotówka',nominal:'1 złoty',ruler:'Stanisław August Poniatowski',mint:'Warszawa',era:'Stanisławowska',metal:'Srebro'},
{year:'1831',title:'2 złote Powstanie Listopadowe',nominal:'2 złote',ruler:'Powstanie Listopadowe',mint:'Warszawa',era:'Powstanie Listopadowe',metal:'Srebro'},
{year:'1932',title:'10 złotych Polonia',nominal:'10 złotych',ruler:'II Rzeczpospolita',mint:'Warszawa',era:'II Rzeczpospolita',metal:'Srebro'},
{year:'1933',title:'10 złotych Jan III Sobieski',nominal:'10 złotych',ruler:'II Rzeczpospolita',mint:'Warszawa',era:'II Rzeczpospolita',metal:'Srebro'},
{year:'2024',title:'2 złote obiegowe',nominal:'2 złote',ruler:'Rzeczpospolita Polska',mint:'Warszawa',era:'III Rzeczpospolita',metal:'Bimetal'}];
const $=x=>document.getElementById(x),fields=['ruler','nominal','mint','era'];function fill(id){const el=$(id);[...new Set(demo.map(x=>x[id]))].sort().forEach(v=>el.insertAdjacentHTML('beforeend',`<option>${v}</option>`))}fields.forEach(fill);let view=localStorage.getItem('apomonet_album_view')||'small';function render(){const items=demo.filter(c=>fields.every(f=>!$(f).value||c[f]===$(f).value));$('resultCount').textContent=`Pokazano ${items.length} z ${demo.length} monet`;$('coinList').className='coin-list '+view;$('coinList').innerHTML=items.map(c=>`<article class="card coin-card"><span class="demo">PRZYKŁAD</span><span class="eyebrow">${c.year}</span><h2>${c.title}</h2><p><strong>${c.ruler}</strong></p><p>${c.nominal} • ${c.mint}</p><p class="muted">${c.era} • ${c.metal}</p></article>`).join('')||'<div class="empty">Brak monet spełniających wybrane filtry.</div>';document.querySelectorAll('.viewbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}fields.forEach(f=>$(f).onchange=render);document.querySelectorAll('.viewbtn').forEach(b=>b.onclick=()=>{view=b.dataset.view;localStorage.setItem('apomonet_album_view',view);render()});$('reset').onclick=()=>{fields.forEach(f=>$(f).value='');render()};render();
</script></body></html>
