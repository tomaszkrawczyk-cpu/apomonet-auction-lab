<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Album • ApoMonet</title><link rel="stylesheet" href="style.css"><style>.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}.viewbar,.selectbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.viewbtn.active{border-color:#b87918;color:#e8a33a}.coin-list{display:grid;gap:12px}.coin-list.small{grid-template-columns:repeat(2,minmax(0,1fr))}.coin-list.large{grid-template-columns:1fr}.coin-card{position:relative;overflow:hidden}.pick-wrap{position:absolute;top:12px;right:12px;z-index:5;background:#111d;border:1px solid #555;border-radius:999px;padding:6px}.pick-wrap input{width:20px;height:20px}.coin-photo{width:100%;height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;background:radial-gradient(circle at 50% 45%,#272729,#111 72%);border-radius:14px}.coin-photo img{max-width:94%;max-height:132px;object-fit:contain;filter:drop-shadow(0 5px 8px #000)}.coin-list.small .coin-photo{height:112px}.coin-list.small .coin-photo img{max-height:98px}.coin-list.large .coin-photo{height:240px}.coin-list.large .coin-photo img{max-height:220px}.coin-list.list .coin-card{min-height:124px;padding-left:142px}.coin-list.list .coin-photo{position:absolute;left:14px;top:14px;width:108px;height:96px;margin:0}.coin-list.list .coin-photo img{max-width:98px;max-height:88px}.demo{font-size:10px;color:#d99732}.result-count{color:#999;font-size:13px;margin:8px 0 12px}.album-kind{display:inline-flex;gap:7px;align-items:center;padding:7px 11px;border-radius:999px;border:1px solid #4a361b;background:#17120c;color:#d99732;font-size:12px;margin-bottom:8px}.coin-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.move-select{max-width:190px;padding:8px;border-radius:10px;background:#18181b;color:#fff;border:1px solid #39393d}.license-note{margin:22px 0 90px;font-size:11px;color:#777;line-height:1.5}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#1f1609;border:1px solid #8c5e1b;color:#fff;padding:11px 15px;border-radius:999px;z-index:70;display:none}.selected-info{font-size:13px;color:#aaa;align-self:center}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:430px){.coin-list.small{grid-template-columns:1fr 1fr}.coin-card{padding:12px}.coin-list.small .coin-card h2{font-size:16px}.coin-list.small .coin-card p{font-size:11px}.move-select{max-width:100%}}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="albums.html">← Albumy</a><a href="collection.html">Kolekcja</a><a href="analyze.html">Analiza</a></nav></header><main class="shell"><section class="hero compact"><div id="kind" class="album-kind"></div><h1 id="albumTitle">Album</h1><p id="albumDesc"></p></section><div class="filters"><select id="ruler" class="input"><option value="">Wszyscy władcy / emitenci</option></select><select id="nominal" class="input"><option value="">Wszystkie nominały</option></select><select id="mint" class="input"><option value="">Wszystkie mennice</option></select><select id="era" class="input"><option value="">Wszystkie epoki</option></select></div><div class="viewbar"><button class="btn secondary viewbtn" data-view="list">Lista</button><button class="btn secondary viewbtn" data-view="small">Małe kafelki</button><button class="btn secondary viewbtn" data-view="large">Duże kafelki</button><button id="reset" class="btn secondary">Wyczyść filtry</button><button id="resetMoves" class="btn secondary">Przywróć układ demo</button></div><div class="selectbar"><button id="selectAll" class="btn secondary">Zaznacz wszystko</button><button id="clearSelection" class="btn secondary">Odznacz wszystko</button><button id="pdfSelected" class="btn primary">PDF z wybranych</button><button id="shareSelected" class="btn primary">Udostępnij wybrane</button><span id="selectedInfo" class="selected-info">Zaznaczono: 0</span></div><div id="resultCount" class="result-count"></div><section id="coinList" class="coin-list"></section><p class="license-note">Album demonstracyjny. Przenoszenie i zaznaczenia są zapamiętywane tylko na czas pracy w prototypie. Zdjęcia monet pochodzą z Wikimedia Commons i służą do pokazania docelowego układu ApoMonet.</p></main><div id="toast" class="toast"></div><nav class="bottom-nav"><a href="index.html">Start</a><a href="analyze.html">Analiza</a><a href="collection.html">Kolekcja</a><a href="calendar.html">Aukcje</a><a class="active" href="albums.html">Albumy</a></nav><script src="app.js"></script><script>
const IMG={mieszko:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Denar%20rys%20mieszko1.png?width=420',chrobry:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Denar%20Boleslav%20Chrobry.jpg?width=420',polonia:'https://commons.wikimedia.org/wiki/Special:Redirect/file/10%20zlotych%201932%20Polonia.jpg?width=520',sobieski:'https://commons.wikimedia.org/wiki/Special:Redirect/file/1933%2010-z%C5%82otych%20coin%20obverse%20with%20John%20III%20Sobieski.jpg?width=420',gulden:'https://commons.wikimedia.org/wiki/Special:Redirect/file/1%20Danziger%20Gulden%20%281923%29.jpg?width=520',fenigi:'https://commons.wikimedia.org/wiki/Special:Redirect/file/2fenigi%20gdansk.jpg?width=520',poloniaProba:'https://commons.wikimedia.org/wiki/Special:Redirect/file/PR%C3%93BA%2010%20z%C5%82otych%201932%20Polonia%20g%C5%82%C4%99bokie%20bicie.jpg?width=520'};
const meta={mine:{kind:'✓ MOJE',title:'Moja kolekcja',desc:'Monety, które już znajdują się w kolekcji.'},targets:{kind:'◎ CELE',title:'Cele kolekcjonerskie',desc:'Monety, których aktywnie szukam.'},dreams:{kind:'✦ MARZENIA',title:'Monety marzeń',desc:'Rzadkie lub wyjątkowe monety, które chcę kiedyś zdobyć.'}};
const coins=[
{id:'mine-mieszko',origin:'mine',year:'ok. X–XI w.',title:'Denar Mieszka',nominal:'Denar',ruler:'Mieszko I / wczesni Piastowie',mint:'Polska',era:'Pierwsi Piastowie',metal:'Srebro',img:IMG.mieszko},
{id:'mine-chrobry',origin:'mine',year:'ok. 1000',title:'Denar PRINCES POLONIE',nominal:'Denar',ruler:'Bolesław I Chrobry',mint:'Polska',era:'Pierwsi Piastowie',metal:'Srebro',img:IMG.chrobry},
{id:'mine-polonia',origin:'mine',year:'1932',title:'10 złotych Polonia',nominal:'10 złotych',ruler:'II Rzeczpospolita',mint:'Warszawa',era:'II Rzeczpospolita',metal:'Srebro',img:IMG.polonia},
{id:'mine-sobieski',origin:'mine',year:'1933',title:'10 złotych Jan III Sobieski',nominal:'10 złotych',ruler:'II Rzeczpospolita',mint:'Warszawa',era:'II Rzeczpospolita',metal:'Srebro',img:IMG.sobieski},
{id:'target-gulden',origin:'targets',year:'1923',title:'1 gulden',nominal:'1 gulden',ruler:'Wolne Miasto Gdańsk',mint:'Utrecht',era:'Wolne Miasto Gdańsk',metal:'Srebro',img:IMG.gulden},
{id:'target-fenigi',origin:'targets',year:'1923',title:'2 fenigi',nominal:'2 fenigi',ruler:'Wolne Miasto Gdańsk',mint:'Berlin',era:'Wolne Miasto Gdańsk',metal:'Brąz',img:IMG.fenigi},
{id:'target-polonia',origin:'targets',year:'1932',title:'10 złotych Polonia',nominal:'10 złotych',ruler:'II Rzeczpospolita',mint:'Warszawa',era:'II Rzeczpospolita',metal:'Srebro',img:IMG.polonia},
{id:'target-chrobry',origin:'targets',year:'ok. 1000',title:'Denar Bolesława Chrobrego',nominal:'Denar',ruler:'Bolesław I Chrobry',mint:'Polska',era:'Pierwsi Piastowie',metal:'Srebro',img:IMG.chrobry},
{id:'dream-mieszko',origin:'dreams',year:'ok. X–XI w.',title:'Denar wczesnopiastowski',nominal:'Denar',ruler:'Mieszko I / wczesni Piastowie',mint:'Polska',era:'Pierwsi Piastowie',metal:'Srebro',img:IMG.mieszko},
{id:'dream-chrobry',origin:'dreams',year:'ok. 1000',title:'Denar PRINCES POLONIE',nominal:'Denar',ruler:'Bolesław I Chrobry',mint:'Polska',era:'Pierwsi Piastowie',metal:'Srebro',img:IMG.chrobry},
{id:'dream-proba',origin:'dreams',year:'1932',title:'PRÓBA 10 złotych Polonia',nominal:'10 złotych PRÓBA',ruler:'II Rzeczpospolita',mint:'Warszawa',era:'II Rzeczpospolita',metal:'Srebro',img:IMG.poloniaProba},
{id:'dream-gulden',origin:'dreams',year:'1923',title:'1 gulden Wolnego Miasta Gdańska',nominal:'1 gulden',ruler:'Wolne Miasto Gdańsk',mint:'Utrecht',era:'Wolne Miasto Gdańsk',metal:'Srebro',img:IMG.gulden}];
const MOVE_KEY='apomonet_demo_album_moves_v1';let moves={};try{moves=JSON.parse(localStorage.getItem(MOVE_KEY)||'{}')}catch(e){}const params=new URLSearchParams(location.search),setName=params.get('set')||'mine',$=x=>document.getElementById(x),fields=['ruler','nominal','mint','era'];let selected=new Set();$('kind').textContent=meta[setName].kind;$('albumTitle').textContent=meta[setName].title;$('albumDesc').textContent=meta[setName].desc;function currentSet(c){return moves[c.id]||c.origin}function albumCoins(){return coins.filter(c=>currentSet(c)===setName)}function filteredCoins(){return albumCoins().filter(c=>fields.every(f=>!$(f).value||c[f]===$(f).value))}function rebuildFilters(){fields.forEach(f=>{const el=$(f),keep=el.value;el.innerHTML=`<option value="">${f==='ruler'?'Wszyscy władcy / emitenci':f==='nominal'?'Wszystkie nominały':f==='mint'?'Wszystkie mennice':'Wszystkie epoki'}</option>`;[...new Set(albumCoins().map(x=>x[f]))].sort().forEach(v=>el.insertAdjacentHTML('beforeend',`<option>${v}</option>`));if([...el.options].some(o=>o.value===keep))el.value=keep})}let view=localStorage.getItem('apomonet_album_view')||'small';function showToast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function moveCoin(id,to){const c=coins.find(x=>x.id===id);if(!c||to===setName)return;moves[id]=to;selected.delete(id);localStorage.setItem(MOVE_KEY,JSON.stringify(moves));rebuildFilters();render();showToast(to==='mine'&&setName==='dreams'?'✨ Zdobyte marzenie! Moneta trafiła do Mojej kolekcji.':`Przeniesiono do „${meta[to].title}”.`)}function updateSelectedInfo(){$('selectedInfo').textContent=`Zaznaczono: ${selected.size}`}function exportSelected(type='pdf'){const chosen=coins.filter(c=>selected.has(c.id));if(!chosen.length)return alert('Najpierw zaznacz monety.');sessionStorage.setItem('apomonet_export_ids','[]');sessionStorage.setItem('apomonet_demo_export_coins',JSON.stringify(chosen));location.href=`export.html?type=${type}`}async function shareSelected(){const chosen=coins.filter(c=>selected.has(c.id));if(!chosen.length)return alert('Najpierw zaznacz monety.');const text=`APOMONET — ${meta[setName].title}\n\n`+chosen.map((c,i)=>`${i+1}. ${c.title} — ${c.year} — ${c.ruler} — ${c.nominal}`).join('\n');if(navigator.share){try{await navigator.share({title:`APOMONET — ${meta[setName].title}`,text});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(text);alert('Lista została skopiowana. Możesz wkleić ją do WhatsApp, Messengera lub e-maila.')}catch{location.href='mailto:?subject='+encodeURIComponent(`APOMONET — ${meta[setName].title}`)+'&body='+encodeURIComponent(text)}}function render(){const base=albumCoins(),items=filteredCoins();$('resultCount').textContent=`Pokazano ${items.length} z ${base.length} monet`;$('coinList').className='coin-list '+view;$('coinList').innerHTML=items.map(c=>`<article class="card coin-card"><label class="pick-wrap" title="Zaznacz monetę"><input class="coin-pick" type="checkbox" data-id="${c.id}" ${selected.has(c.id)?'checked':''}></label><div class="coin-photo"><img src="${c.img}" alt="${c.title}" loading="lazy" referrerpolicy="no-referrer"></div><span class="demo">PRZYKŁAD</span> <span class="eyebrow">${c.year}</span><h2>${c.title}</h2><p><strong>${c.ruler}</strong></p><p>${c.nominal} • ${c.mint}</p><p class="muted">${c.era} • ${c.metal}</p><div class="coin-actions"><select class="move-select" data-id="${c.id}"><option value="">Przenieś do…</option>${Object.keys(meta).filter(k=>k!==setName).map(k=>`<option value="${k}">${meta[k].title}</option>`).join('')}</select>${setName==='mine'?'':`<a class="btn secondary" href="calendar.html">Sprawdź aukcje</a>`}</div></article>`).join('')||'<div class="empty">Ten album jest pusty albo filtry ukrywają wszystkie monety.</div>';document.querySelectorAll('.viewbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('.move-select').forEach(s=>s.onchange=()=>{if(s.value&&confirm(`Przenieść „${coins.find(c=>c.id===s.dataset.id).title}” do „${meta[s.value].title}”?`))moveCoin(s.dataset.id,s.value);else s.value=''});document.querySelectorAll('.coin-pick').forEach(p=>p.onchange=()=>{p.checked?selected.add(p.dataset.id):selected.delete(p.dataset.id);updateSelectedInfo()});updateSelectedInfo()}fields.forEach(f=>$(f).onchange=render);document.querySelectorAll('.viewbtn').forEach(b=>b.onclick=()=>{view=b.dataset.view;localStorage.setItem('apomonet_album_view',view);render()});$('reset').onclick=()=>{fields.forEach(f=>$(f).value='');render()};$('resetMoves').onclick=()=>{if(confirm('Przywrócić początkowy układ trzech albumów demonstracyjnych?')){moves={};selected.clear();localStorage.removeItem(MOVE_KEY);rebuildFilters();render()}};$('selectAll').onclick=()=>{filteredCoins().forEach(c=>selected.add(c.id));render()};$('clearSelection').onclick=()=>{selected.clear();render()};$('pdfSelected').onclick=()=>exportSelected('pdf');$('shareSelected').onclick=shareSelected;rebuildFilters();render();
</script></body></html>
