<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edycja monety • ApoMonet</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="index.html">Start</a><a href="analyze.html">Analiza</a><a class="active" href="collection.html">Kolekcja</a><a href="albums.html">Albumy</a><a href="calendar.html">Kalendarz</a><a href="auction-houses.html">Domy aukcyjne</a></nav></header><main class="shell narrow"><section class="hero compact"><span class="eyebrow">Karta monety</span><h1>Edycja i korekta</h1><p>Każde pole z analizy AI może być poprawione ręcznie. Zapis tworzy wpis w historii zmian.</p></section><form id="form" class="card"><input type="hidden" id="id"><label>Tytuł<input class="input" id="title" placeholder="np. Grosz koronny"></label><label>Nominał<input class="input" id="nominal"></label><label>Władca / emitent<input class="input" id="ruler"></label><label>Rok<input class="input" id="year" inputmode="numeric"></label><label>Mennica<input class="input" id="mint"></label><label>Odmiana / typ<input class="input" id="variant"></label><label>Stan zachowania<input class="input" id="grade"></label><label>Rzadkość<input class="input" id="rarity"></label><label>Opis katalogowy<textarea class="input" id="description" rows="7" placeholder="Opis do kolekcji lub katalogu aukcyjnego"></textarea></label><label>Notatki eksperta<textarea class="input" id="notes" rows="5"></textarea></label><label>Proweniencja<textarea class="input" id="provenance" rows="4" placeholder="Poprzednie kolekcje, aukcje, dokumenty..."></textarea></label><label>Numer katalogowy<input class="input" id="catalog"></label><label>Cena zakupu<input class="input" id="purchasePrice" inputmode="decimal"></label><label>Waluta<select class="input" id="currency"><option>PLN</option><option>EUR</option><option>USD</option><option>GBP</option></select></label><div class="toolbar"><button class="btn primary" type="submit">Zapisz korektę</button><a class="btn secondary" href="collection.html">Wróć do kolekcji</a><a class="btn secondary" href="fees.html">Policz koszty aukcji</a></div><div id="saved" class="status"></div></form><div class="section-title"><h2>Historia zmian</h2></div><div id="history" class="timeline"></div></main><script src="app.js"></script><script>const q=new URLSearchParams(location.search),coinId=q.get('id');const fields=['title','nominal','ruler','year','mint','variant','grade','rarity','description','notes','provenance','catalog','purchasePrice','currency'];let coin=coinId?ApoMonet.getCoin(coinId):null;if(coin){id.value=coin.id;fields.forEach(k=>{if(document.getElementById(k))document.getElementById(k).value=coin[k]||''})}function renderHistory(){const s=ApoMonet.load();const rows=s.history.filter(h=>!coinId||h.coinId===coinId).slice(0,20);history.innerHTML=rows.length?rows.map(h=>`<div class="event"><div class="date">${new Date(h.at).toLocaleDateString('pl-PL')}</div><div><strong>${h.type==='coin_updated'?'Korekta karty':'Zmiana'}</strong><p class="muted">${new Date(h.at).toLocaleTimeString('pl-PL')}</p></div><span class="badge">${h.title||'Moneta'}</span></div>`).join(''):'<div class="empty">Brak zapisanej historii zmian.</div>'}renderHistory();form.addEventListener('submit',e=>{e.preventDefault();const data={};fields.forEach(k=>data[k]=document.getElementById(k).value.trim());if(coinId)data.id=coinId;coin=ApoMonet.upsertCoin(data);saved.textContent='Zapisano korektę i dodano wpis do historii.';history.innerHTML='';renderHistory();if(!coinId)history.replaceChildren(history.cloneNode(true));});</script></body></html>
