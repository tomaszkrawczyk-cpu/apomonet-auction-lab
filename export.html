<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eksport • ApoMonet</title><link rel="stylesheet" href="style.css"><style>.export-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px}.export-list{display:grid;gap:18px}.export-card{background:#fff;color:#171717;border-radius:18px;padding:20px;border:1px solid #ddd}.export-card h2{margin:0 0 6px}.coin-images{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.coin-images img{width:100%;max-height:240px;object-fit:contain;background:#f5f5f5;border-radius:14px}.data-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px}.data-grid div{padding:7px 0;border-bottom:1px solid #eee}.data-grid span{display:block;font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.05em}.section-title{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#666}.historical-note,.audit-note{font-size:12px;color:#666;margin-top:4px}.audit-note{padding:9px 11px;border:1px solid #ddd;border-radius:10px}.desc{margin-top:14px;line-height:1.6}.print-title{display:none}@media(max-width:650px){.data-grid{grid-template-columns:1fr 1fr}.export-head{display:block}.export-head .toolbar{margin-top:12px}}@media print{body{background:#fff!important;color:#111!important}.topbar,.toolbar{display:none!important}.shell{max-width:none!important;padding:0!important}.print-title{display:block;margin-bottom:20px}.export-card{break-inside:avoid;box-shadow:none;border:1px solid #bbb;margin-bottom:18px}.coin-images img{max-height:210px}.export-list{display:block}}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="albums.html">Albumy</a><a href="collection.html">Kolekcja</a></nav></header><main class="shell"><div class="export-head"><div><span class="eyebrow">Eksport</span><h1>Wybrane monety</h1><p id="summary"></p></div><div class="toolbar"><button id="pdfBtn" class="btn primary">Zapisz / drukuj PDF</button><button id="shareBtn" class="btn primary">Udostępnij wybrane</button><button id="excelBtn" class="btn secondary">Pobierz Excel (.xlsx)</button><button id="backBtn" class="btn secondary">Wróć</button></div></div><div class="print-title"><h1>APOMONET — wybrane monety</h1><p>Wybrane pozycje z kolekcji lub albumu.</p></div><section id="list" class="export-list"></section></main><script src="app.js"></script><script>const ids=JSON.parse(sessionStorage.getItem('apomonet_export_ids')||'[]');const s=ApoMonet.load();let coins=s.coins.filter(c=>ids.includes(c.id));if(!coins.length){try{coins=JSON.parse(sessionStorage.getItem('apomonet_demo_export_coins')||'[]')}catch(e){coins=[]}}const v=x=>x&&String(x).trim()?x:'—';summary.textContent=`Wybrano ${coins.length} ${coins.length===1?'monetę':'monety/monet'} do eksportu.`;list.innerHTML=coins.length?coins.map((c,i)=>`<article class="export-card"><span class="eyebrow">Pozycja ${i+1}</span><h2>${v(c.title)}</h2><p>${[c.country,c.ruler,c.year,c.nominal].filter(Boolean).join(' • ')}</p><div class="coin-images">${c.obverseImage||c.img?`<div><img src="${c.obverseImage||c.img}" alt="Awers"><small>Awers / miniatura</small></div>`:'<div></div>'}${c.reverseImage?`<div><img src="${c.reverseImage}" alt="Rewers"><small>Rewers</small></div>`:'<div></div>'}</div><div class="section-title literature-title">Literatura specjalistyczna</div><div class="data-grid literature-grid"><div><span>Kopicki</span>${v(c.kopickiReference)}</div><div><span>Rzadkość</span>${v(c.kopickiRarity||c.rarityGeneral||c.rarity)}</div><div><span>Tyszkiewicz</span>${v(c.tyszkiewiczReference)}</div><div><span>Wartość historyczna Tyszkiewicza</span>${v(c.tyszkiewiczValue)}</div><div><span>Parchimowicz</span>${v(c.parchimowiczReference)}</div></div>${c.tyszkiewiczValue?'<div class="historical-note">Wartość Tyszkiewicza jest historyczną oceną katalogową i nie stanowi współczesnej wyceny rynkowej.</div>':''}<div class="section-title market-title">Rynek współczesny</div><div class="data-grid market-grid"><div><span>Wycena</span>${v(c.estimatedPrice||c.marketMedian||c.valuationNote)}</div><div><span>Zakres aukcyjny</span>${v(c.priceRange||(c.estimateLow||c.estimateHigh?`${c.estimateLow||0}–${c.estimateHigh||0} ${c.valuationCurrency||'PLN'}`:''))}</div><div><span>Źródła do ponownej weryfikacji</span>${Number(c.auctionSourcesNeedReverification||0)}</div></div>${Number(c.auctionSourcesNeedReverification||0)>0?`<div class="audit-note">Uwaga audytowa: ${Number(c.auctionSourcesNeedReverification)} źródło/źródła notowań mają starą lub nieznaną datę ostatniej weryfikacji. Historyczne wyniki sprzedaży pozostają faktami rynkowymi, ale przed publikacją profesjonalnego raportu należy ponownie sprawdzić ich linki źródłowe.</div>`:''}<div class="section-title identity-title">Dane monety</div><div class="data-grid identity-grid"><div><span>Kraj / emitent</span>${v(c.country||c.ruler)}</div><div><span>Władca / emitent</span>${v(c.ruler)}</div><div><span>Rok</span>${v(c.year)}</div><div><span>Nominał</span>${v(c.nominal)}</div><div><span>Mennica</span>${v(c.mint)}</div><div><span>Metal</span>${v(c.metal)}</div><div><span>Odmiana</span>${v(c.variant)}</div><div><span>Stan</span>${v(c.grade)}</div></div><div class="desc"><strong>Opis</strong><br>${v(c.fullDescription||c.description||c.era)}</div></article>`).join(''):'<div class="empty">Brak wybranych monet.</div>';pdfBtn.onclick=()=>window.print();backBtn.onclick=()=>history.back();shareBtn.onclick=async()=>{if(!coins.length)return alert('Brak monet do udostępnienia.');const text='APOMONET — wybrane monety\n\n'+coins.map((c,i)=>`${i+1}. ${c.title||'Moneta'}${c.year?' — '+c.year:''}${c.ruler?' — '+c.ruler:''}${c.nominal?' — '+c.nominal:''}`).join('\n');if(navigator.share){try{await navigator.share({title:'APOMONET — wybrane monety',text});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(text);alert('Lista została skopiowana. Możesz wkleić ją do WhatsApp, Messengera lub e-maila.')}catch{location.href='mailto:?subject='+encodeURIComponent('APOMONET — wybrane monety')+'&body='+encodeURIComponent(text)}};excelBtn.onclick=()=>{if(!coins.length)return alert('Brak monet do eksportu.');if(!window.ApoXLSXPackage)return alert('Moduł XLSX nie został załadowany. Odśwież stronę i spróbuj ponownie.');const bytes=ApoXLSXPackage.build(coins),blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='APOMONET-wybrane-monety.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)};const type=new URLSearchParams(location.search).get('type');if(type==='excel')setTimeout(()=>excelBtn.click(),400);</script></body></html>
