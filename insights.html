<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wartość kolekcji • ApoMonet</title><link rel="stylesheet" href="style.css"><style>.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi2{background:#121214;border:1px solid #333;border-radius:16px;padding:15px}.kpi2 small{display:block;color:#888}.kpi2 strong{display:block;font-size:24px;margin-top:4px}.breaks{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #29292c}@media(max-width:650px){.kpis,.breaks{grid-template-columns:1fr 1fr}}@media(max-width:420px){.kpis,.breaks{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="collection.html">Kolekcja</a><a class="active" href="insights.html">Wartość</a><a href="archive.html">Archiwum</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">Kolekcja</span><h1>Wartość i ROI</h1><p>Podsumowanie korzysta z zapisanej wyceny monety lub mediany źródłowych wyników porównawczych. Brak danych pozostaje brakiem danych.</p></section><section id="kpis" class="kpis"></section><section class="breaks" style="margin-top:16px"><div class="card"><h2>Wartość wg władcy / emitenta</h2><div id="byRuler"></div></div><div class="card"><h2>Wartość wg mennicy</h2><div id="byMint"></div></div><div class="card"><h2>Wartość wg nominału</h2><div id="byNominal"></div></div><div class="card"><h2>Wartość wg metalu</h2><div id="byMetal"></div></div></section><section class="card" style="margin-top:16px"><h2>Monety i ROI</h2><div id="rows"></div></section></main><script src="app.js"></script><script src="collection-value-core.js"></script><script>const money=n=>new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN',maximumFractionDigits:0}).format(n||0),coins=ApoMonet.load().coins||[],s=ApoCollectionValue.summary(coins);kpis.innerHTML=`<div class="kpi2"><small>Monety</small><strong>${s.count}</strong></div><div class="kpi2"><small>Z wyceną</small><strong>${s.valued}</strong></div><div class="kpi2"><small>Wartość bieżąca</small><strong>${money(s.current)}</strong></div><div class="kpi2"><small>ROI kolekcji</small><strong>${s.roi==null?'—':s.roi+'%'}</strong></div>`;function group(key,id){const m={};for(const c of coins){const n=c[key]||'Nie ustalono';m[n]=m[n]||{count:0,value:0};m[n].count++;m[n].value+=ApoCollectionValue.value(c)}document.getElementById(id).innerHTML=Object.entries(m).sort((a,b)=>b[1].value-a[1].value).map(([n,x])=>`<div class="row"><span>${n}<small class="muted"> • ${x.count}</small></span><strong>${x.value?money(x.value):'—'}</strong></div>`).join('')||'<div class="empty">Brak danych.</div>'}group('ruler','byRuler');group('mint','byMint');group('nominal','byNominal');group('metal','byMetal');rows.innerHTML=s.rows.map(x=>`<div class="row"><span><strong>${x.coin.title||'Moneta'}</strong><br><small class="muted">${[x.coin.year,x.coin.nominal,x.coin.ruler].filter(Boolean).join(' • ')}</small></span><span style="text-align:right">${x.current?money(x.current):'brak wyceny'}<br><small class="muted">ROI: ${x.roi==null?'—':x.roi+'%'}</small></span></div>`).join('')||'<div class="empty">Kolekcja jest pusta.</div>';</script></body></html>
