<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Otwarte dane • ApoMonet</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="tools.html">Narzędzia</a><a class="active" href="open-data.html">Otwarte dane</a></nav></header><main class="shell narrow"><section class="hero compact"><span class="eyebrow">LEGAL OPEN DATA</span><h1>Import otwartych pojęć</h1><p>Wyłącznie zatwierdzone źródła: Nomisma i Wikidata. Importujemy etykietę, typ, identyfikator, licencję i provenance — bez zdjęć i cudzych opisów.</p></section><section class="card"><label>Źródło<select id="source" class="input"><option value="NOMISMA">Nomisma • CC-BY</option><option value="WIKIDATA">Wikidata • CC0</option></select></label><label>Identyfikator<input id="identifier" class="input" placeholder="Nomisma: np. augustus • Wikidata: np. Q1405"></label><button id="fetchBtn" class="btn primary full" type="button">Pobierz i pokaż fakty</button><div id="status" class="status"></div></section><section id="preview" class="card" style="margin-top:14px" hidden><h2>Podgląd</h2><div id="facts"></div><button id="saveBtn" class="btn primary full" type="button">Zapisz do otwartego słownika APOMONET</button></section><section class="card" style="margin-top:14px"><h2>Zapisane pojęcia</h2><input id="q" class="input" placeholder="Szukaj"><div id="list"></div></section></main><script src="app.js"></script><script src="open-concepts-core.js"></script><script>let current=null;function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function draw(){const z=(q.value||'').toLowerCase(),rows=ApoOpenConcepts.load().filter(x=>!z||[x.label,x.id,x.source,x.conceptType].join(' ').toLowerCase().includes(z));list.innerHTML=rows.length?rows.map(x=>'<div class="event"><div><strong>'+esc(x.label)+'</strong><p class="muted">'+esc(x.source)+' • '+esc(x.id)+' • '+esc(x.conceptType||'typ nieustalony')+'</p></div><span class="badge">'+esc(x.license)+'</span></div>').join(''):'<div class="empty">Brak zapisanych pojęć.</div>'}fetchBtn.onclick=async()=>{try{fetchBtn.disabled=true;status.textContent='Pobieram dane z zatwierdzonego źródła…';current=await ApoOpenConcepts.fetchConcept(source.value,identifier.value);facts.innerHTML='<div class="event"><div><strong>'+esc(current.label)+'</strong><p class="muted">Źródło: '+esc(current.source)+'<br>ID: '+esc(current.id)+'<br>Typ: '+esc(current.conceptType||'—')+'<br>Licencja: '+esc(current.license)+'</p></div></div>';preview.hidden=false;status.textContent='Pobrano fakty. Nic nie zostało jeszcze zapisane.'}catch(e){preview.hidden=true;current=null;status.textContent='Błąd: '+e.message}finally{fetchBtn.disabled=false}};saveBtn.onclick=()=>{if(!current)return;try{ApoOpenConcepts.upsert(current);status.textContent='Zapisano pojęcie wraz z provenance i licencją.';draw()}catch(e){status.textContent=e.message}};q.oninput=draw;draw();</script></body></html>
