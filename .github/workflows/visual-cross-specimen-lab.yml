name: APOMONET cross-specimen visual lab

on:
  push:
    branches: [codex/visual-lab-20260910]
    paths:
      - '.github/workflows/visual-cross-specimen-lab.yml'
      - 'scripts/lab-cross-specimen-visual.py'
      - 'scripts/lab-prepare-large-visual-corpus.mjs'

permissions:
  contents: write

concurrency:
  group: apomonet-cross-specimen-visual-lab
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU vision dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow requests opencv-python-headless
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Prepare rights-gated separated corpus
        run: node scripts/lab-prepare-large-visual-corpus.mjs

      - name: Run 500-type visual benchmark
        run: python -u scripts/lab-cross-specimen-visual.py

      - name: Validate result
        run: |
          python -m json.tool lab/results/visual-cross-specimen-500-2026-09-10.json >/dev/null
          test -s lab/results/visual-cross-specimen-500-2026-09-10.md

      - name: Upload aggregate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apomonet-cross-specimen-visual-results
          path: |
            lab/results/visual-cross-specimen-500-2026-09-10.json
            lab/results/visual-cross-specimen-500-2026-09-10.md
          if-no-files-found: warn
          retention-days: 14

      - name: Commit aggregate results to laboratory branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/results/visual-cross-specimen-500-2026-09-10.json lab/results/visual-cross-specimen-500-2026-09-10.md
          git diff --cached --quiet && exit 0
          git commit -m "Record 500-type cross-specimen visual benchmark"
          git push
