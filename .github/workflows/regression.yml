name: APOMONET regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run regression suite
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/*.test.mjs tests/*.test.js *.test.mjs *.test.js test-*.mjs)
          if ((${#tests[@]} == 0)); then
            echo "No regression tests found"
            exit 1
          fi
          node --test "${tests[@]}"
