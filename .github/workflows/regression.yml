name: APOMONET regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run regression suite
        run: node --test tests/*.test.mjs tests/*.test.js *.test.mjs *.test.js test-*.mjs
