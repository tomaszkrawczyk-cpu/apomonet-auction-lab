<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fingerprint monet • ApoMonet</title><link rel="stylesheet" href="style.css"><style>.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{padding:14px;border:1px solid #333;border-radius:14px;background:#121214}.stat small{display:block;color:#888}.stat strong{display:block;font-size:22px;margin-top:4px}.match{padding:14px;border-bottom:1px solid #29292c}.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.feature{padding:10px;border:1px solid #2c2c2f;border-radius:12px;background:#141416}.feature span{display:block;color:#888;font-size:12px}.feature strong{display:block;margin-top:4px}.feature small{display:block;color:#777;margin-top:4px}@media(max-width:600px){.stats,.feature-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="tools.html">Narzędzia</a><a class="active" href="fingerprints.html">Fingerprint</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">APOMONET DIE LAB</span><h1>Fingerprint / biometria monety</h1><p>Porównanie diagnostycznych cech stempla bez przechowywania cudzych opisów lub fotografii źródłowych.</p></section><section id="stats" class="stats"></section><section class="card"><div class="section-title"><h2>Porównaj zapisaną monetę</h2><span class="todo">ETAP 2</span></div><select id="coinSelect" class="input"><option value="">Wybierz monetę z fingerprintem…</option></select><div id="features" style="margin-top:12px"></div><div id="matches" style="margin-top:12px"></div></section></main><script src="app.js"></script><script>const $=x=>document.getElementById(x);function init(){if(!window.ApoFingerprint||!window.ApoMonet)return;const rows=ApoFingerprint.load(),accepted=rows.filter(x=>x.expertAccepted).length,templates=ApoFingerprint.templates().length;stats.innerHTML=`<div class="stat"><small>Fingerprinty</small><strong>${rows.length}</strong></div><div class="stat"><small>Ekspercko zaakceptowane</small><strong>${accepted}</strong></div><div class="stat"><small>Rodziny szablonów</small><strong>${templates}</strong></div>`;const coins=(ApoMonet.load().coins||[]).filter(c=>c.fingerprint||c.detail?.fingerprint);coinSelect.innerHTML='<option value="">Wybierz monetę z fingerprintem…</option>'+coins.map(c=>`<option value="${c.id}">${c.title||[c.ruler,c.nominal,c.year].filter(Boolean).join(' ')||'Moneta'}</option>`).join('');coinSelect.onchange=draw}function draw(){const c=ApoMonet.getCoin(coinSelect.value);if(!c)return;const fp=c.fingerprint||c.detail?.fingerprint,f=fp?.features||{};features.innerHTML='<h3>Cechy diagnostyczne</h3><div class="feature-grid">'+Object.entries(f).filter(([,v])=>v&&v.value).map(([k,v])=>`<div class="feature"><span>${k}</span><strong>${v.value}</strong><small>pewność ${v.confidence||0}% • ${v.method||''}</small></div>`).join('')+'</div>';const cand=ApoFingerprint.candidates(c,fp,10).filter(x=>x.coinId!==c.id);matches.innerHTML='<h3>Najbliższe fingerprinty</h3>'+(cand.length?cand.map(x=>`<div class="match"><strong>${x.identity.ruler||''} ${x.identity.nominal||''} ${x.identity.year||''}</strong><br><span class="muted">zgodność ${x.match.similarity}% • ${x.match.matchedFeatures} wspólnych cech • ${x.match.quality}${x.match.conflicts.length?' • konflikty: '+x.match.conflicts.join(', '):''}</span></div>`).join(''):'<div class="empty">Za mało fingerprintów do porównania. Biblioteka będzie rosła wraz z kolejnymi analizami Etapu 2 i weryfikacją ekspertów.</div>')}addEventListener('DOMContentLoaded',init);</script></body></html>
