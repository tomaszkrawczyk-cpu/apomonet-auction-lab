<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kolekcja • ApoMonet</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="index.html">Start</a><a href="analyze.html">Analiza</a><a class="active" href="collection.html">Kolekcja</a><a href="albums.html">Albumy</a><a href="calendar.html">Kalendarz</a><a href="auction-houses.html">Domy aukcyjne</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">Kolekcja</span><h1>Moje monety</h1><p>Katalog monet z edycją danych, historią korekt, wyceną, pochodzeniem i notatkami.</p></section><div class="toolbar"><input id="search" class="input" placeholder="Szukaj po roku, władcy, nominale…"><a class="btn primary" href="analyze.html">+ Dodaj przez analizę</a><a class="btn secondary" href="coin-edit.html">+ Dodaj ręcznie</a><a class="btn secondary" href="fees.html">Kalkulator aukcyjny</a></div><section id="coins" class="grid"></section></main><nav class="bottom-nav"><a href="index.html">Start</a><a href="analyze.html">Analiza</a><a class="active" href="collection.html">Kolekcja</a><a href="calendar.html">Aukcje</a><a href="albums.html">Albumy</a></nav><script src="app.js"></script><script>function render(){const q=(search.value||'').toLowerCase();const list=ApoMonet.load().coins.filter(c=>[c.title,c.nominal,c.ruler,c.year,c.mint].join(' ').toLowerCase().includes(q));coins.innerHTML=list.length?list.map(c=>`<article class="card"><span class="eyebrow">${c.year||'Rok nieustalony'}</span><h2>${c.title||'Moneta bez nazwy'}</h2><p>${[c.nominal,c.ruler,c.mint].filter(Boolean).join(' • ')||'Dane do uzupełnienia'}</p><div class="meta"><a href="coin-edit.html?id=${encodeURIComponent(c.id)}">Edytuj i popraw →</a></div></article>`).join(''):'<div class="empty">Kolekcja jest pusta. Dodaj monetę przez analizę albo ręcznie.</div>'}search.addEventListener('input',render);render();</script></body></html>
