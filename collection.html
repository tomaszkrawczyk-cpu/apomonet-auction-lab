<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kolekcja • ApoMonet</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><style>.value-box{margin:14px 0 20px;padding:18px;border:1px solid #3a2a15;border-radius:18px;background:#111}.value-box[hidden]{display:none}.value-total{font-size:32px;font-weight:800;color:#d9952f;margin:5px 0}.value-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.value-stat{padding:10px;border-radius:12px;background:#191919}.value-stat small{display:block;color:#888}.value-stat strong{display:block;margin-top:3px}.value-note{font-size:12px;color:#888;margin-top:12px}@media(max-width:600px){.value-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html">ApoMonet</a><nav class="nav"><a href="index.html">Start</a><a href="analyze.html">Analiza</a><a class="active" href="collection.html">Kolekcja</a><a href="albums.html">Albumy</a><a href="calendar.html">Kalendarz</a><a href="auction-houses.html">Domy aukcyjne</a></nav></header><main class="shell"><section class="hero compact"><span class="eyebrow">Kolekcja</span><h1>Moje monety</h1><p>Katalog monet z edycją danych, historią korekt, wyceną, pochodzeniem i notatkami.</p></section><div class="toolbar"><input id="search" class="input" placeholder="Szukaj po roku, władcy, nominale…"><a class="btn primary" href="analyze.html">+ Dodaj przez analizę</a><a class="btn secondary" href="coin-edit.html">+ Dodaj ręcznie</a><button id="valueBtn" class="btn primary" type="button">Podaj wartość mojej kolekcji</button><a class="btn secondary" href="fees.html">Kalkulator aukcyjny</a></div><section id="valueBox" class="value-box" hidden></section><section id="coins" class="grid"></section></main><nav class="bottom-nav"><a href="index.html">Start</a><a href="analyze.html">Analiza</a><a class="active" href="collection.html">Kolekcja</a><a href="calendar.html">Aukcje</a><a href="albums.html">Albumy</a></nav><script src="app.js"></script><script>
function money(v){return new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN',maximumFractionDigits:0}).format(v||0)}
function coinValue(c){const vals=[c.value,c.estimatedValue,c.estimate,c.valuation,c.priceEstimate,c.marketValue].map(Number).filter(v=>Number.isFinite(v)&&v>0);return vals[0]||0}
function render(){const q=(search.value||'').toLowerCase();const list=ApoMonet.load().coins.filter(c=>[c.title,c.nominal,c.ruler,c.year,c.mint].join(' ').toLowerCase().includes(q));coins.innerHTML=list.length?list.map(c=>`<article class="card"><span class="eyebrow">${c.year||'Rok nieustalony'}</span><h2>${c.title||'Moneta bez nazwy'}</h2><p>${[c.nominal,c.ruler,c.mint].filter(Boolean).join(' • ')||'Dane do uzupełnienia'}</p><div class="meta">${coinValue(c)?`Szacunkowo: ${money(coinValue(c))} • `:''}<a href="coin-edit.html?id=${encodeURIComponent(c.id)}">Edytuj i popraw →</a></div></article>`).join(''):'<div class="empty">Kolekcja jest pusta. Dodaj monetę przez analizę albo ręcznie.</div>'}
search.addEventListener('input',render);valueBtn.onclick=()=>{const list=ApoMonet.load().coins,valued=list.filter(c=>coinValue(c)>0),sum=valued.reduce((s,c)=>s+coinValue(c),0);valueBox.hidden=false;if(!list.length){valueBox.innerHTML='<h2>Wartość kolekcji</h2><p>Najpierw dodaj monety do kolekcji. ApoMonet zsumuje ich wyceny.</p>';return}if(!valued.length){valueBox.innerHTML=`<h2>Wartość kolekcji</h2><p>Masz ${list.length} monet, ale żadna nie ma jeszcze zapisanej wyceny. Najpierw wykonaj analizę lub uzupełnij wycenę monet.</p>`;return}valueBox.innerHTML=`<span class="eyebrow">Szacunkowa wartość</span><div class="value-total">${money(sum)}</div><div class="value-grid"><div class="value-stat"><small>Monety w kolekcji</small><strong>${list.length}</strong></div><div class="value-stat"><small>Z wyceną</small><strong>${valued.length}</strong></div><div class="value-stat"><small>Bez wyceny</small><strong>${list.length-valued.length}</strong></div></div><div class="value-note">To suma zapisanych wycen monet, a nie gwarantowana cena sprzedaży. Docelowo ApoMonet będzie aktualizował wartość na podstawie porównywalnych wyników aukcyjnych i stanu zachowania.</div>`};render();
</script></body></html>
